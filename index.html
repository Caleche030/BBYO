<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임 버전 트래커</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg2: #f5f5f3;
    --bg3: #eeede9;
    --text: #1a1a1a;
    --text2: #666660;
    --text3: #999994;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --radius: 10px;
    --radius-lg: 14px;
  }

  body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: var(--bg2);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── 헤더 ── */
  header {
    background: var(--bg);
    border-bottom: 0.5px solid var(--border);
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 0;
  }
  .site-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    padding: 16px 20px 16px 0;
    margin-right: 16px;
    border-right: 0.5px solid var(--border);
    white-space: nowrap;
  }
  .tabs {
    display: flex;
    overflow-x: auto;
    gap: 0;
  }
  .tab-btn {
    padding: 18px 18px;
    background: none;
    border: none;
    border-bottom: 2.5px solid transparent;
    font-size: 14px;
    font-weight: 400;
    color: var(--text2);
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: color 0.15s;
  }
  .tab-btn.active { font-weight: 500; }

  /* ── 컨텐츠 ── */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 24px;
  }

  /* ── 로딩 ── */
  .loading {
    text-align: center;
    padding: 80px 0;
    color: var(--text3);
    font-size: 14px;
  }
  .loading-dot {
    display: inline-block;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

  /* ── 메인 그리드 ── */
  .main-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
  }
  .section-label {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 16px;
  }

  /* ── 버전 카드 ── */
  .vcard {
    background: var(--bg);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-lg);
    padding: 20px;
    border-left: 4px solid var(--ga);
  }
  .vc-game { font-size: 11px; color: var(--text3); margin-bottom: 4px; letter-spacing: 0.05em; text-transform: uppercase; }
  .vc-ver  { font-size: 22px; font-weight: 600; color: var(--ga); line-height: 1.1; }
  .vc-dates{ font-size: 13px; color: var(--text2); margin-top: 3px; margin-bottom: 16px; }
  .vc-all-btn { margin-left: auto; align-self: flex-start; padding: 5px 10px; border: 0.5px solid var(--ga); border-radius: 20px; background: var(--gb); color: var(--gp); font-size: 11px; font-weight: 500; font-family: inherit; cursor: pointer; white-space: nowrap; transition: background 0.15s, color 0.15s; }
  .vc-all-btn:hover { background: var(--ga); color: var(--gb); }
  .game-icon-lg { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
  .tab-icon { width: 18px; height: 18px; border-radius: 4px; object-fit: cover; vertical-align: middle; margin-right: 5px; }

  .ph-section { margin-bottom: 14px; }
  .ph-section:last-of-type { margin-bottom: 0; }
  .ph-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 7px; }
  .ph-title { font-size: 14px; font-weight: 600; color: var(--text2); }
  .ph-title.active { color: var(--ga); }
  .ph-countdown { font-size: 12px; color: var(--text3); }
  .ph-countdown.active { color: var(--ga); }
  .ph-tags { display: flex; flex-wrap: wrap; gap: 5px; }

  .tag-n { font-size: 12px; padding: 3px 10px; border-radius: 5px; background: var(--gb); color: var(--gp); font-weight: 500; }
  .tag-r { font-size: 12px; padding: 3px 10px; border-radius: 5px; background: var(--bg3); color: var(--text2); }
  .tag-empty { font-size: 12px; color: var(--text3); font-style: italic; }
  .tag-memo { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--bg3); color: var(--text2); border: 0.5px solid var(--border); }

  .card-divider { height: 0.5px; background: var(--border); margin: 14px 0; }
  .next-lbl { font-size: 11px; color: var(--text3); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
  .next-ver { font-size: 13px; font-weight: 600; color: var(--text); }
  .next-dates { font-size: 12px; color: var(--text2); margin-left: 5px; }

  /* ── 도구 탭 ── */
  .tool-tabs {
    display: flex;
    margin-bottom: 12px;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    overflow-x: auto;
    width: fit-content;
    max-width: 100%;
    background: var(--bg3);
  }
  .tool-tab {
    padding: 9px 20px;
    background: none;
    border: none;
    font-size: 14px;
    color: var(--text2);
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  .tool-tab.on { background: var(--text); color: var(--bg); font-weight: 600; border-radius: calc(var(--radius) - 1px); }
  .tool-panel { background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius-lg); padding: 20px; }
  .tool-games { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }

  /* ── 캐릭터 초상화 ── */
  .pt-box { display: inline-flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; vertical-align: middle; font-weight: 700; }
  .pt-box img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
  .pt-r5 { background: linear-gradient(160deg, #94612F 0%, #D9A156 100%); }
  .pt-r4 { background: linear-gradient(160deg, #5E4B94 0%, #A283D6 100%); }
  .pt-r0 { background: var(--bg3); color: var(--text3); border: 0.5px dashed var(--border2); }
  .pt-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; padding: 2px 6px 2px 2px; border-radius: 4px; }
  .pt-tip-img { position: relative; }
  .pt-tip-img .pt-box { border-radius: 10px !important; }
  .pt-attr-ic { position: absolute; right: 5px; width: 28px; height: 28px; border-radius: 50%; background: rgba(28,28,32,0.82); display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
  .pt-attr-ic img { width: 20px; height: 20px; object-fit: contain; }
  .pt-attr-tr { top: 5px; }
  .pt-attr-br { bottom: 5px; }
  .tag-pt { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 2px; }
  .ph-tags { gap: 10px 8px !important; }
  .pt-tile { position: relative; display: inline-flex; flex-direction: column; align-items: center; gap: 4px; cursor: default; vertical-align: top; }
  .pt-tile .pt-tip-img { border-radius: 9px; }
  .pt-tile.is-new .pt-tip-img { box-shadow: 0 0 0 2px var(--ga, #888); }
  .pt-tile.is-rerun .pt-tip-img { box-shadow: 0 0 0 1px var(--border2); }
  .pt-tile.is-guess .pt-tip-img { box-shadow: none; outline: 1.5px dashed var(--ga, #888); outline-offset: 1px; opacity: 0.7; }
  .pt-tile-badge { position: absolute; left: 3px; top: 3px; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; background: rgba(28,28,32,0.82); color: #fff; }
  .pt-tile-name { font-size: 11px; font-weight: 600; color: var(--text); text-align: center; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pt-tile.is-rerun .pt-tile-name { color: var(--text2); font-weight: 500; }
  .legend-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
  .legend-chip i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; background: var(--bg3); font-style: normal; }
  .legend-chip .lg-new { box-shadow: 0 0 0 2px #888; }
  .legend-chip .lg-re { width: auto; height: auto; font-size: 9px; font-weight: 700; padding: 1px 4px; background: rgba(28,28,32,0.82); color: #fff; }
  .legend-chip .lg-guess { outline: 1.5px dashed #888; outline-offset: 1px; }

  /* ── 글로벌 매출 ── */
  .rev-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rev-table th { font-size: 11px; font-weight: 500; color: var(--text3); text-align: right; padding: 0 8px 8px; border-bottom: 0.5px solid var(--border2); }
  .rev-table th:first-child, .rev-table td:first-child { text-align: left; padding-left: 0; }
  .rev-table td { text-align: right; padding: 10px 8px; border-bottom: 0.5px solid var(--border); white-space: nowrap; }
  .rev-table tbody tr { cursor: pointer; }
  .rev-table tbody tr:hover { background: var(--bg2); }
  .rev-legend { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text2); }
  .rev-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .rev-table td[data-rg] { cursor: help; }
  .rev-table td small { font-size: 10px; }
  .rev-table { margin-top: 18px; }
  .rev-game-link { cursor: pointer; display: inline-flex; align-items: center; }
  .rev-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .rev-nav-lbl { font-size: 14px; font-weight: 600; flex: 1; text-align: center; }
  .sc-btn:disabled { opacity: 0.35; cursor: default; }
  .rev-bars-grouped { gap: 16px; }
  .rev-group { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; }
  .rev-group-bars { flex: 1; min-height: 0; display: flex; align-items: flex-end; gap: 3px; }
  .rev-group .rev-mon { text-align: center; }
  .rev-col[data-rg] { cursor: help; }
  .rev-bars { display: flex; align-items: flex-end; gap: 4px; height: 180px; }
  .rev-col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .rev-bar { width: 100%; max-width: 36px; border-radius: 4px 4px 0 0; }
  .rev-val { font-size: 10px; color: var(--text2); margin-bottom: 3px; }
  .rev-mon { font-size: 10px; color: var(--text3); margin-top: 5px; white-space: nowrap; }
  .rev-note { font-size: 11px; color: var(--text3); margin-top: 16px; }
  .rev-note a { color: inherit; }

  /* ── 복각 계산기 ── */
  .calc-desc  { font-size: 12px; color: var(--text2); margin-bottom: 14px; }
  .calc-row   { display: flex; gap: 8px; }
  .calc-input {
    flex: 1;
    padding: 9px 13px;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .calc-input:focus { border-color: var(--ga); }
  .calc-btn {
    padding: 9px 20px;
    border: none;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .calc-btn:hover { opacity: 0.85; }
  .result-box { margin-top: 14px; padding: 16px; border-radius: var(--radius); }
  .r-found { background: var(--gb); border: 0.5px solid var(--gm); }
  .r-error  { background: #FEF3E0; border: 0.5px solid #FAC775; }
  .r-none   { background: var(--bg3); border: 0.5px solid var(--border); }
  .r-char { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .r-retire-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .r-retire-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
  .r-retire-note { font-size: 12px; color: var(--text2); }
  .r-stats { display: flex; border: 0.5px solid var(--gm); border-radius: var(--radius); overflow: hidden; }
  .r-stat { flex: 1; padding: 12px 0; text-align: center; background: var(--bg); }
  .r-stat + .r-stat { border-left: 0.5px solid var(--gm); }
  .r-num { font-size: 24px; font-weight: 600; }
  .r-lbl { font-size: 11px; color: var(--text2); margin-top: 3px; }
  .r-sub { font-size: 12px; color: var(--text2); margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--gm); }
  .rr-card { margin-top:14px; border:0.5px solid var(--gm); border-radius:var(--radius-lg); overflow:hidden; background:var(--bg); }
  .rr-main { display:flex; gap:18px; padding:16px 18px; background:var(--gb); align-items:center; }
  .rr-left { flex-shrink:0; text-align:center; }
  .rr-name { font-size:15px; font-weight:700; color:var(--ga); margin-top:6px; }
  .rr-right { flex:1; min-width:0; }
  .rr-status { font-size:24px; font-weight:800; line-height:1.2; }
  .rr-sub { font-size:13px; color:var(--text); margin-top:6px; }
  .rr-sub b, .rr-compare b { color:var(--ga); }
  .rr-compare { font-size:12px; color:var(--text2); margin-top:4px; }
  .rr-facts { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .rr-facts span { font-size:12px; color:var(--text2); background:var(--bg); border:0.5px solid var(--gm); border-radius:20px; padding:3px 10px; }
  .rr-facts b { color:var(--text); }
  .rr-hist { padding:12px 18px 14px; }
  .rr-hist-t { font-size:12px; font-weight:600; color:var(--text2); margin-bottom:8px; }
  .rr-chips { display:flex; flex-wrap:wrap; align-items:center; gap:5px; }
  .rr-chip { font-size:11px; padding:3px 8px; border-radius:5px; background:var(--bg3); color:var(--text2); white-space:nowrap; }
  .rr-chip b { color:var(--text); }
  .rr-now { background:var(--ga); color:var(--gb); }
  .rr-now b { color:var(--gb); }
  .rr-future { background:var(--bg); border:1px dashed var(--ga); color:var(--ga); }
  .rr-future b { color:var(--ga); }
  .rr-wait { background:var(--bg); border:1px solid var(--ga); color:var(--ga); font-weight:600; }
  .rr-gap { font-size:10px; color:var(--text3); }
  .rr-gap::before { content:'→ '; }
  .rs-grid { display:flex; flex-wrap:wrap; gap:10px; }
  .rs-item { display:flex; flex-direction:column; align-items:center; gap:4px; width:64px; cursor:pointer; opacity:.75; }
  .rs-item:hover, .rs-item.on { opacity:1; }
  .rs-item.on .pt-box { outline:2px solid var(--ga); outline-offset:1px; }
  .rs-name { font-size:11px; color:var(--text2); text-align:center; line-height:1.25; word-break:keep-all; }
  .rs-item.on .rs-name { color:var(--ga); font-weight:700; }
  .rk-wrap { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px; }
  .rk-col { border:0.5px solid var(--gm); border-radius:var(--radius-lg); padding:12px 14px; background:var(--bg); min-width:0; }
  .rk-t { font-size:13px; font-weight:700; color:var(--ga); margin-bottom:6px; }
  .rk-row { display:flex; align-items:center; gap:10px; padding:6px 4px; border-radius:var(--radius); cursor:pointer; }
  .rk-row:hover { background:var(--gb); }
  .rk-row + .rk-row { border-top:0.5px solid var(--border); }
  .rk-no { width:16px; font-size:15px; font-weight:800; color:var(--ga); text-align:center; flex-shrink:0; }
  .rk-row .pt-box { flex-shrink:0; }
  .rk-txt { flex:1; min-width:0; display:flex; flex-direction:column; }
  .rk-txt b { font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rk-txt span { font-size:11px; color:var(--text3); }
  .rk-val { font-size:15px; font-weight:800; color:var(--text); white-space:nowrap; }
  .rk-empty, .rk-more { font-size:11px; color:var(--text3); padding:4px; }
  .rk-note { font-size:11px; color:var(--text3); margin-top:8px; }
  @media (max-width: 600px) {
    .rk-wrap { grid-template-columns:1fr; }
    .rr-main { gap:12px; padding:14px; }
    .rr-left .pt-box { width:84px !important; height:84px !important; }
    .rr-status { font-size:19px; }
  }
  .sug-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .sug-btn {
    font-size: 12px; padding: 4px 12px;
    border: 0.5px solid var(--border2); border-radius: 20px;
    background: var(--bg); cursor: pointer; font-family: inherit; color: var(--text);
  }
  .sug-btn:hover { background: var(--bg3); }

  /* ── 타임라인 ── */
  .tl-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .tl-accent-bar { width: 4px; height: 22px; border-radius: 2px; }
  .tl-game-title { font-size: 16px; font-weight: 600; color: var(--text); }
  .tl-sort-lbl { font-size: 12px; color: var(--text3); }

  .timeline { position: relative; padding-left: 32px; }
  .tl-line { position: absolute; left: 8px; top: 0; bottom: 0; width: 1px; background: var(--border2); }
  .tl-item { position: relative; margin-bottom: 10px; }
  .tl-dot { position: absolute; border-radius: 50%; transform: translateX(-50%); left: 8px; }
  .tl-card { border-radius: var(--radius); padding: 13px 15px; }
  .tl-current { background: var(--gb); border: 0.5px solid var(--gm); }
  .tl-future  { background: var(--bg); border: 0.5px solid var(--border); }
  .tl-past    { background: var(--bg); border: 0.5px solid var(--border); opacity: 0.65; }
  .tl-sep { display:flex; align-items:center; gap:10px; margin:32px 0 14px; }
  .tl-sep-bar { width:4px; height:20px; border-radius:2px; background:var(--ga); flex-shrink:0; }
  .tl-sep-label { font-size:16px; font-weight:700; color:var(--ga); }
  .tl-sep-line { flex:1; height:1px; background:var(--border); }
  .tl-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .tl-ver { font-size: 15px; font-weight: 600; }
  .tl-dates { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .tl-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .tl-ph-title { font-size: 13px; font-weight: 600; margin: 9px 0 5px; }
  .tl-ph-title.active { color: var(--ga); }
  .tl-ph-title.dim    { color: var(--text2); }

  /* ── 범례 ── */
  .legend { display: flex; gap: 8px; align-items: center; margin-top: 16px; flex-wrap: wrap; }

  /* ── 에러 ── */
  .error-box { background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius-lg); padding: 40px; text-align: center; color: var(--text2); font-size: 14px; }

  @media (max-width: 600px) {
    main { padding: 20px 16px; }
    header { padding: 0 16px; }
    .site-title { display: none; }
    .tool-tab { padding: 8px 12px; font-size: 13px; }
    .tool-panel { padding: 16px; }
  }

  /* ── 가챠 계산기 ── */
  .gc-game-btn { display:flex; align-items:center; gap:8px; padding:7px 14px; border:1.5px solid var(--border2); border-radius:var(--radius); background:var(--bg2); cursor:pointer; font-family:inherit; font-size:14px; color:var(--text2); transition:all 0.15s; }
  .gc-game-btn img { width:28px; height:28px; border-radius:6px; display:block; }
  .gc-seg { display:flex; border:0.5px solid var(--border2); border-radius:var(--radius); overflow:hidden; background:var(--bg3); width:fit-content; }
  .gc-seg button { padding:7px 13px; background:none; border:none; font-size:13px; color:var(--text2); cursor:pointer; font-family:inherit; white-space:nowrap; }
  .gc-seg button.on { background:var(--gc-a,#BA7517); color:var(--gc-b,#FEF3E0); font-weight:500; }
  .gc-inp { padding:8px 10px; border:0.5px solid var(--border2); border-radius:var(--radius); font-size:14px; font-family:inherit; background:var(--bg); color:var(--text); outline:none; }
  .gc-inp:focus { border-color:var(--gc-a,#BA7517); }
  .gc-row { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:13px; }
  .gc-reset { margin-left:auto; align-self:center; }
  .gc-guide { background:var(--bg2); }
  .gc-guide .gc-head-k { color:var(--text); }
  .gc-steps { margin:0; padding:14px 20px 16px 38px; font-size:13px; color:var(--text2); line-height:1.7; }
  .gc-steps b { color:var(--text); }
  .gc-row:last-child { margin-bottom:0; }
  .gc-lbl { font-size:12px; color:var(--text2); margin-bottom:5px; }

  .gc-head-pct span { font-size:11px; color:var(--text2); }

  .gc-avail b { color:var(--text); }

  .gc-sec-t { font-size:12px; font-weight:600; color:var(--text2); margin-bottom:10px; }
  .gc-pts { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .gc-pt-sub { font-size:10px; color:var(--text3); margin-top:1px; }
  .gc-hint { font-size:10px; color:var(--text3); margin-top:3px; }
  .gc-split { display:flex; height:28px; border-radius:7px; overflow:hidden; gap:2px; }
  .gc-split-seg { display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; min-width:0; white-space:nowrap; }
  .gc-split-legs { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; }
  .gc-split-leg { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--text2); }
  .gc-split-leg i { width:10px; height:10px; border-radius:3px; display:inline-block; }
  .gc-split-leg b { color:var(--text); }
  .gc-pt { background:var(--bg2); border-radius:var(--radius); padding:10px 4px; text-align:center; }
  .gc-pt-v { font-size:20px; font-weight:700; }
  .gc-pt-v small { font-size:11px; font-weight:500; margin-left:1px; }
  .gc-pt-l { font-size:11px; color:var(--text2); margin-top:2px; }
  .gc-pt-ok { font-size:10px; margin-top:3px; }
  .gc-curve { position:relative; height:120px; margin:22px 0 22px; }
  .gc-curve svg { width:100%; height:100%; display:block; overflow:visible; border-bottom:0.5px solid var(--border2); }
  .gc-curve-dot { position:absolute; width:10px; height:10px; border-radius:50%; transform:translate(-50%, -50%); box-shadow:0 0 0 2px var(--bg); }
  .gc-curve-tag { position:absolute; top:-20px; font-size:11px; font-weight:700; white-space:nowrap; padding:0 4px; }
  .gc-curve-x { position:absolute; bottom:-18px; transform:translateX(-50%); font-size:10px; color:var(--text3); white-space:nowrap; }
  .gc-curve-x:last-of-type { transform:translateX(-100%); }
  .gc-curve-y { position:absolute; left:2px; transform:translateY(-110%); font-size:10px; color:var(--text3); }
  .gc-needs { display:flex; gap:8px; flex-wrap:wrap; }
  .gc-need { flex:1; min-width:150px; background:#FCEBEB; border-radius:var(--radius); padding:11px 13px; }
  .gc-need.ok { background:#EAF3DE; }
  .gc-need-l { font-size:11px; color:var(--text2); }
  .gc-need-v { font-size:17px; font-weight:700; margin-top:2px; color:#A32D2D; }
  .gc-need.ok .gc-need-v { color:#3B6D11; }
  .gc-need-s { font-size:12px; color:var(--text2); margin-top:2px; }
  .gc-note { font-size:11px; color:var(--text3); padding:10px 20px; background:var(--bg2); }
  @media (max-width: 600px) {
    .gc-head { padding:14px; gap:12px; }
    .gc-head img { width:56px; height:56px; }
    .gc-head { flex-wrap:wrap; }
    .gc-head-k { font-size:17px; }
    .gc-head-pct { width:100%; text-align:left; display:flex; align-items:baseline; gap:8px; padding-left:68px; }
    .gc-head-pct b { font-size:30px; }
    .gc-sec, .gc-avail, .gc-note { padding-left:14px; padding-right:14px; }
  }

  /* ── 비교 탭 스크러버 ── */
  .sc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .sc-title  { font-size: 15px; font-weight: 600; }
  .sc-btn    { padding: 6px 14px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); font-size: 12px; font-family: inherit; cursor: pointer; color: var(--text2); transition: background 0.12s; }
  .sc-btn:hover { background: var(--bg3); }
  .sc-btn.today { border-color: #e53e3e; color: #e53e3e; }
  .sc-date-lbl { font-size: 14px; font-weight: 700; color: #e53e3e; margin-left: auto; }
  .sc-outer  { background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius-lg); overflow: hidden; }
  .sc-layout { display: flex; }
  .sc-label-col  { width: 70px; flex-shrink: 0; border-right: 0.5px solid var(--border); }
  .sc-label-cell { height: 44px; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; font-size: 11px; font-weight: 600; border-bottom: 0.5px solid var(--border); }
  .sc-label-ruler { height: 60px; }
  .sc-viewport { flex: 1; position: relative; overflow: hidden; cursor: grab; user-select: none; -webkit-user-select: none; }
  .sc-viewport.grabbing { cursor: grabbing; }
  .sc-track   { position: absolute; top: 0; left: 0; will-change: transform; }
  .sc-bar-row { position: relative; height: 44px; border-bottom: 0.5px solid var(--border); }
  .sc-bar     { position: absolute; top: 7px; bottom: 7px; border-radius: 4px; display: flex; align-items: center; padding: 0 7px; font-size: 10px; white-space: nowrap; overflow: hidden; transition: box-shadow 0.1s; }
  .sc-ruler   { position: relative; height: 60px; border-top: 0.5px solid var(--border2); }
  .sc-redline { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #e53e3e; pointer-events: none; z-index: 10; transform: translateX(-50%); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <p class="site-title">BBYO</p>
    <div class="tabs" id="tabs"></div>
  </div>
</header>

<main id="main">
  <div class="loading">
    <span class="loading-dot" style="animation-delay:0s">●</span>&nbsp;
    <span class="loading-dot" style="animation-delay:0.2s">●</span>&nbsp;
    <span class="loading-dot" style="animation-delay:0.4s">●</span>
    <p style="margin-top:12px;">시트 데이터 불러오는 중...</p>
  </div>
</main>

<script>
// ── 설정 ──────────────────────────────────────────────
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTyz6c92R-LC6sF8uNb5HPpHkZsjkHZXJoO6J8kmyjR84hAzrOyiX-bUmuPRJhXVSbUk8-TOm8FFM0p/pub?output=csv';

const GAME_CONFIG = {
  '원신':     { id:'genshin',   a:'#0D9488', b:'#F0FDFA', m:'#5EEAD4', p:'#115E59', icon:'icon-genshin.png' },
  '명조':     { id:'wuwa',      a:'#38362A', b:'#F5F3E4', m:'#B0A818', p:'#141208', icon:'icon-wuwa.png' },
  '스타레일': { id:'starrail',  a:'#1B3A6B', b:'#EEF2FC', m:'#C8A020', p:'#0C1C3D', icon:'icon-starrail.png' },
};
const GAME_ORDER = ['원신', '스타레일', '명조'];
// 시트 A열 표기 → 화면 표기
const SHEET_GAME_ALIAS = { '붕스': '스타레일' };

// 복각 계산 특수 처리 캐릭터
// 아래 캐릭터는 복각 대상이 아니다. 검색하면 해당 목록 전체를 초상화로 보여주고, 복각 순위에서도 뺀다.
// standard = 상시 캐릭터 전체(반천장에서 지면 나오는 캐릭터. 픽업됐다가 편입된 캐릭터, 이례적으로 픽업된 각청 포함)
// pickable = 스타레일 '별빛 인연의 초대'(픽뚫 목록)에 추가된 캐릭터 (기존 상시 7명 + 이 목록에서 지정)
// shop = 스타레일 금빛 영혼 상점에서 교환 가능한 캐릭터
// free = 무료 지급, notes = 검색 결과에 붙는 캐릭터별 설명
const SPECIAL_CHARS = {
  '원신': {
    standard: ['다이루크', '진', '모나', '치치', '각청', '타이나리', '데히야', '유메미즈키 미즈키'],
    notes: {
      '각청': '상시 캐릭터인데 이례적으로 1.3버전에 픽업된 적이 있어요.',
      '치치': '6.7 후반 귀환 기원 묶음 배너에 상시 포지션(꽝)으로 들어간 적이 있어요.',
      '유메미즈키 미즈키': '5.4 픽업 후 상시로 편입됐어요. 6.7 후반 귀환 기원 묶음 배너에는 상시 포지션(꽝)으로 들어갔어요.',
      '타이나리': '픽업 캐릭터였다가 상시로 편입됐어요.',
      '데히야': '픽업 캐릭터였다가 상시로 편입됐어요.',
    },
  },
  '스타레일': {
    standard: ['히메코', '웰트', '브로냐', '게파드', '클라라', '백로', '연경'],
    pickable: ['제레', '블레이드', '부현', '운리', '은랑', '아젠티'],
    shop: ['완·매', '나찰', '토파즈&복순이', '곽향', '로빈'],
  },
  '명조': {
    standard: ['카카루', '앙코', '감심', '능양', '벨리나'],
    free: ['방랑자·기류'],   // 무료 지급(픽업 배너 아님) → 복각 순위에서 제외
  },
};

const REGION_MAP = {
  genshin:  { '1':'몬드 & 리월', '2':'이나즈마', '3':'수메르', '4':'폰타인', '5':'나타', '6':'노드크라이', '7':'스네즈나야' },
  starrail: { '1':'우주 정거장 · 야릴로Ⅵ · 선주 나부', '2':'페나코니 · 선주 나부', '3':'엠포리어스 · 페나코니', '4':'이상 낙원' },
  wuwa:     { '1':'금주 · 검은 해안', '2':'리나시타', '3':'라하이로이', '3.5':'몽주' },
};

// ── 유틸 ──────────────────────────────────────────────
const TODAY = new Date();
TODAY.setHours(0,0,0,0);

function pd(s) {
  if (!s) return null;
  const clean = s.replace(/\./g, '/').trim();
  const [y, m, d] = clean.split('/');
  if (!y || !m || !d) return null;
  return new Date(+y, +m - 1, +d);
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function fmt(d) { if (!d) return '?'; return `${d.getMonth()+1}/${String(d.getDate()).padStart(2,'0')}`; }
function dLeft(d) { return Math.max(0, Math.ceil((d - TODAY) / 86400000)); }
function sp(s) { return s ? s.split(/[\/,]/).map(n => n.trim()).filter(Boolean) : []; }

function getPhase(v) {
  const s = pd(v.s), e = pd(v.e);
  if (!s || !e) return { st: 'unknown' };
  const mid = addDays(s, 21);
  if (TODAY < s) return { st: 'future', mid };
  if (TODAY >= e) return { st: 'past', mid };
  return { st: 'current', half: TODAY < mid ? '전반' : '후반', mid, end: e };
}

// ── CSV 파싱 ──────────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  let cur = '', inQ = false, row = [];
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') {
      if (inQ && text[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (ch === ',' && !inQ) {
      row.push(cur.trim()); cur = '';
    } else if ((ch === '\n' || ch === '\r') && !inQ) {
      if (ch === '\r' && text[i+1] === '\n') i++;
      row.push(cur.trim()); cur = '';
      if (row.some(c => c)) rows.push(row);
      row = [];
    } else {
      cur += ch;
    }
  }
  if (cur || row.length) { row.push(cur.trim()); if (row.some(c=>c)) rows.push(row); }
  return rows;
}

function buildGameData(rows) {
  const games = {};
  let curGame = null;

  rows.forEach(row => {
    const [g, ver, s, e, fn, fr, hn, hr, memo] = row;
    // 헤더 행 스킵
    if (ver === '버전' || ver === '시작 날짜') return;
    // 게임명 행 (GAME_CONFIG에 없는 게임은 블록 전체 무시)
    const gName = SHEET_GAME_ALIAS[g] || g;
    if (g) curGame = GAME_CONFIG[gName] ? gName : null;
    if (!curGame) return;
    if (!ver || !s) return;

    if (!games[curGame]) games[curGame] = [];
    games[curGame].push({
      v: ver,
      s: s.replace(/\./g, '/'),
      e: e ? e.replace(/\./g, '/') : '',
      fn: fn || '', fr: fr || '',
      hn: hn || '', hr: hr || '',
      memo: memo || ''
    });
  });
  return games;
}

// ── 캐릭터 초상화 ─────────────────────────────────────
// portraits.json: tools/build_portraits.py 로 생성 (nanoka.cc)
let PORTRAITS = {};
function portraitKey(x) {  // build_portraits.py 의 norm() 과 같게 유지
  return x.replace(/\?/g, '').replace(/\((4성|5성|전반|중반|후반)\)/g, '').replace(/[\s ·•.:&]/g, '').toLowerCase();
}
function portraitInfo(game, name) { return ((PORTRAITS[game] || {}).chars || {})[portraitKey(name)] || null; }
function portraitAttr(game, key) { return key ? ((PORTRAITS[game] || {}).attrs || {})[key] || null : null; }
const PT_WLABEL = { '원신': '무기', '스타레일': '운명의 길', '명조': '무기' };
function portraitBox(game, name, size) {
  const p = portraitInfo(game, name);
  const st = `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.45)}px;border-radius:${size < 30 ? 4 : 8}px;`;
  return p
    ? `<span class="pt-box pt-r${p.r}" style="${st}"><img src="${p.f}" alt="" loading="lazy"></span>`
    : `<span class="pt-box pt-r0" style="${st}">?</span>`;
}

// 초상화 + 오버레이(속성 = 우측 상단, 무기·운명의 길 = 우측 하단). 성급은 배경색으로 구분
function portraitWithAttrs(g, n, size) {
  const p = portraitInfo(g, n);
  const d = size >= 100 ? 28 : Math.max(18, Math.round(size * 0.3)), inset = size >= 100 ? 5 : 3;
  const st = size >= 100 ? '' : ` style="width:${d}px;height:${d}px;right:${inset}px;${'{pos}'}:${inset}px;"`;
  const attr = (key, pos, lbl) => {
    const a = portraitAttr(g, key);
    const sty = st.replace('{pos}', pos === 'tr' ? 'top' : 'bottom');
    return a ? `<span class="pt-attr-ic pt-attr-${pos}"${sty} title="${lbl} · ${a.n}"><img src="${a.f}" alt="${a.n}"${size >= 100 ? '' : ` style="width:${Math.round(d * 0.72)}px;height:${Math.round(d * 0.72)}px;"`}></span>` : '';
  };
  return `<div class="pt-tip-img">${portraitBox(g, n, size)}${p ? attr(p.e, 'tr', '속성') + attr(p.w, 'br', PT_WLABEL[g] || '무기') : ''}</div>`;
}


// ── 렌더 헬퍼 ─────────────────────────────────────────
// 버전 카드·전체 버전 타임라인용 초상화 타일. 신규 = 게임색 테두리, 복각 = '복각' 배지, ? = 추측(점선·흐리게)
// 크기: 메인 카드 88px(한 줄 3개), 전체 버전 타임라인 PC 128px(한 줄 7개) / 모바일 80px(한 줄 3개)
const PT_MAIN = 88, PT_TL = () => window.innerWidth < 600 ? 80 : 128;
function ptTile(n, g, rerun, size) {
  const guess = n.includes('?');
  return `<span class="pt-tile${rerun ? ' is-rerun' : ' is-new'}${guess ? ' is-guess' : ''}" title="${n}">
    ${portraitWithAttrs(g, n, size)}${rerun ? '<span class="pt-tile-badge">복각</span>' : ''}
    <span class="pt-tile-name" style="max-width:${size}px;">${n}</span></span>`;
}
function nt(arr, g, size = PT_MAIN) { return arr.map(n => ptTile(n, g, false, size)).join(''); }
function rt(arr, g, size = PT_MAIN) { return arr.map(n => ptTile(n, g, true, size)).join(''); }

function phSection(g, title, isActive, countdown, fnA, frA) {
  const hasChars = fnA.length || frA.length;
  return `<div class="ph-section">
    <div class="ph-head">
      <span class="ph-title${isActive ? ' active' : ''}">${title}</span>
      ${countdown ? `<span class="ph-countdown${isActive ? ' active' : ''}">${countdown}</span>` : ''}
    </div>
    <div class="ph-tags">${hasChars ? (nt(fnA, g) + rt(frA, g)) : '<span class="tag-empty">정보 없음</span>'}</div>
  </div>`;
}

function renderVersionCard(gameName, v, showNext, nxt) {
  const c = GAME_CONFIG[gameName];
  const info = getPhase(v);
  const s = pd(v.s), e = pd(v.e), mid = info.mid || (s ? addDays(s, 21) : null);
  const fnA = sp(v.fn), frA = sp(v.fr), hnA = sp(v.hn), hrA = sp(v.hr);
  const f1cd = info.st === 'current' && info.half === '전반' ? `종료까지 ${dLeft(mid)}일` : '';
  const f2cd = info.st === 'current' && info.half === '후반' ? `종료까지 ${dLeft(e)}일` : '';

  let nxtHtml = '';
  if (showNext && nxt) {
    const ns = pd(nxt.s), ne = pd(nxt.e);
    const nfn = sp(nxt.fn), nfr = sp(nxt.fr), nhn = sp(nxt.hn), nhr = sp(nxt.hr);
    const nhF = nfn.length || nfr.length, nhB = nhn.length || nhr.length;
    nxtHtml = `<div class="card-divider"></div>
      <p class="next-lbl">다음 버전</p>
      <p style="margin-bottom:8px;"><span class="next-ver">${nxt.v}버전</span><span class="next-dates">(${fmt(ns)} – ${fmt(ne)})</span></p>
      ${nhF ? phSection(gameName, '전반', false, '', nfn, nfr) : ''}
      ${nhB ? phSection(gameName, '후반', false, '', nhn, nhr) : ''}`;
  }

  return `<div class="vcard" style="--ga:${c.a};--gb:${c.b};--gm:${c.m};--gp:${c.p};">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
      ${c.icon ? `<img src="${c.icon}" class="game-icon-lg" onerror="this.style.display='none'">` : ''}
      <div><p class="vc-game">${gameName}</p><p class="vc-ver">${v.v}버전</p></div>
      <button class="vc-all-btn" onclick="sw('${gameName}')">전체 버전 보기</button>
    </div>
    <p class="vc-dates">(${fmt(s)} – ${fmt(e)})</p>
    ${phSection(gameName, '전반', info.half === '전반', f1cd, fnA, frA)}
    <div class="card-divider"></div>
    ${phSection(gameName, '후반', info.half === '후반', f2cd, hnA, hrA)}
    ${v.memo ? `<div style="margin-top:10px;"><span class="tag-memo">${v.memo}</span></div>` : ''}
    ${nxtHtml}
  </div>`;
}

function tlCard(v, gameName) {
  const c = GAME_CONFIG[gameName];
  const info = getPhase(v);
  const isCur = info.st === 'current', isFut = info.st === 'future', isPast = info.st === 'past';
  const s = pd(v.s), e = pd(v.e), mid = info.mid || (s ? addDays(s, 21) : null);
  const fnA = sp(v.fn), frA = sp(v.fr), hnA = sp(v.hn), hrA = sp(v.hr);
  const hasAny = fnA.length || frA.length || hnA.length || hrA.length;
  const dotSz = isCur ? 16 : 10;
  const dotBg = isCur ? c.a : (isFut ? '#fff' : '#ccc');
  const dotBrd = isCur ? 'none' : `1.5px solid ${isFut ? c.m : '#ccc'}`;
  const verClr = isCur ? c.a : (isPast ? 'var(--text2)' : 'var(--text)');

  const f1cd = isCur && info.half === '전반' ? `종료까지 ${dLeft(mid)}일` : '';
  const f2cd = isCur && info.half === '후반' ? `종료까지 ${dLeft(e)}일` : '';

  let ch = '';
  if (isCur || hasAny) {
    ch = `<div style="margin-top:8px;">
      <p class="tl-ph-title${isCur && info.half === '전반' ? ' active' : ' dim'}">전반</p>
      <div class="ph-tags" style="margin-bottom:2px;">
        ${fnA.length || frA.length ? (nt(fnA, gameName, PT_TL()) + rt(frA, gameName, PT_TL())) : '<span class="tag-empty">-</span>'}
        ${f1cd ? `<span style="font-size:12px;color:${c.a};margin-left:4px;">${f1cd}</span>` : ''}
      </div>
      <p class="tl-ph-title${isCur && info.half === '후반' ? ' active' : ' dim'}" style="margin-top:8px;">후반</p>
      <div class="ph-tags">
        ${hnA.length || hrA.length ? (nt(hnA, gameName, PT_TL()) + rt(hrA, gameName, PT_TL())) : '<span class="tag-empty">-</span>'}
        ${f2cd ? `<span style="font-size:12px;color:${c.a};margin-left:4px;">${f2cd}</span>` : ''}
      </div>
    </div>`;
  }

  return `<div class="tl-item">
    <div class="tl-dot" style="width:${dotSz}px;height:${dotSz}px;top:14px;background:${dotBg};border:${dotBrd};"></div>
    <div class="tl-card ${isCur ? 'tl-current' : isFut ? 'tl-future' : 'tl-past'}" style="--ga:${c.a};--gb:${c.b};--gm:${c.m};--gp:${c.p};">
      <div class="tl-top">
        <div>
          <span class="tl-ver" style="color:${verClr};">${v.v}버전</span>
          <span class="tl-dates">(${fmt(s)} – ${fmt(e)})</span>
        </div>
        ${isCur ? `<span class="tl-badge" style="background:${c.a};color:${c.b};">진행 중</span>` : ''}
        ${isFut ? `<span class="tl-badge" style="background:var(--bg3);color:var(--text2);">예정</span>` : ''}
      </div>
      ${v.memo ? `<div style="margin-bottom:4px;"><span class="tag-memo">${v.memo}</span></div>` : ''}
      ${ch}
    </div>
  </div>`;
}

// ── 복각 계산기 ───────────────────────────────────────
function lev(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1}, (_, i) => Array.from({length:n+1}, (_, j) => i ? j ? 0 : i : j));
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n];
}

// 시트 이름 → 검색 키: ? 와 '(중반)'/'(후반)' 같은 시기 표기 제거, 같은 캐릭터의 다른 표기는 하나로
const CHAR_ALIAS = { '토파즈': '토파즈&복순이' };
function charKey(n) {
  const k = n.replace(/\?/g, '').replace(/\((전반|중반|후반)\)/g, '').trim();
  return CHAR_ALIAS[k] || k;
}

function allChars(gameData) {
  const map = {};
  gameData.forEach((v, idx) => {
    const proc = (k, half) => {
      sp(v[k]).forEach(name => {
        const key = charKey(name);
        if (!key) return;
        const isRerun = k === 'fr' || k === 'hr';
        const info = { idx, v: v.v, s: v.s, e: v.e, half };
        if (!map[key]) map[key] = { last: info, rerunCount: isRerun ? 1 : 0 };
        else { map[key].last = info; if (isRerun) map[key].rerunCount++; }
      });
    };
    proc('fn', '전반'); proc('hn', '후반');
    proc('fr', '전반'); proc('hr', '후반');
  });
  return map;
}

// 캐릭터의 전체 등장 이력 (버전 전반/후반 단위). st: past / now / future, guess: 시트에 ? 로 적힌 추측
function rerunHistory(gameData, key) {
  const hist = [];
  gameData.forEach((v, idx) => {
    const s = pd(v.s), e = pd(v.e);
    if (!s || !e) return;
    const mid = addDays(s, 21);
    [['전반', s, mid, v.fn, v.fr], ['후반', mid, e, v.hn, v.hr]].forEach(([half, hs, he, fn, fr]) => {
      [['신규', fn], ['복각', fr]].forEach(([type, col]) => {
        const hit = sp(col).find(n => charKey(n) === key);
        if (!hit) return;
        const st = TODAY >= he ? 'past' : TODAY >= hs ? 'now' : 'future';
        hist.push({ idx, v: v.v, half, type, guess: hit.includes('?'), hs, he, st });
      });
    });
  });
  return hist;
}

// 다음 복각 추정: 마지막 픽업 후 minGap 버전 이상 지난, 복각 라인업이 아직 비어 있는 첫 미래 버전
function estimateRerun(gameData, lastIdx, gameName) {
  const minGap = (gameName === '원신' || gameName === '스타레일') ? 2 : 1;
  for (let i = lastIdx + minGap; i < gameData.length; i++) {
    const v = gameData[i];
    if (getPhase(v).st !== 'future') continue;
    if (sp(v.fr).length > 0 || sp(v.hr).length > 0) continue;   // 복각 라인업이 이미 정해진 버전은 건너뜀
    return { ver: v.v, date: pd(v.s) };
  }
  return null;
}

function calcRerun(gameData, q, gameName) {
  q = q.trim();
  if (!q) return { type: 'empty' };
  const spec = SPECIAL_CHARS[gameName] || {};
  const chars = allChars(gameData);
  const keys = [...new Set([...Object.keys(chars), ...POOL_KINDS.flatMap(k => spec[k] || [])])];
  const exact = keys.find(k => k === q);
  const kind = exact && POOL_KINDS.find(k => spec[k]?.includes(exact));
  if (kind)   // 상시·픽뚫 목록·상점 캐릭터: 복각 대상이 아니므로 해당 목록을 보여줌
    return { type: 'pool', kind, name: exact, hist: rerunHistory(gameData, exact) };
  if (exact) {
    const hist = rerunHistory(gameData, exact);
    const done = hist.filter(h => h.st !== 'future');
    const past = hist.filter(h => h.st === 'past');
    const now = hist.find(h => h.st === 'now');
    const next = hist.find(h => h.st === 'future');
    const last = past[past.length - 1];
    // 등장 간격(버전 수): 같은 버전 안 중복은 제외
    const idxs = [...new Set(done.map(h => h.idx))];
    const gaps = idxs.slice(1).map((x, i) => x - idxs[i]);
    const curIdx = gameData.reduce((m, v, i) => (pd(v.s) && pd(v.s) <= TODAY ? i : m), -1);
    return {
      type: 'found', name: exact, hist, now, next, last,
      rerunCount: done.filter(h => h.type === '복각').length,
      avgGap: gaps.length ? gaps.reduce((a, b) => a + b, 0) / gaps.length : null,
      waitVers: last ? curIdx - last.idx : 0,
      daysSince: last ? Math.max(0, Math.floor((TODAY - last.he) / 86400000)) : 0,
      estimate: !now && !next && last ? estimateRerun(gameData, last.idx, gameName) : null,
    };
  }
  const partial = keys.filter(k => k.includes(q) || q.includes(k));
  if (partial.length === 1) return calcRerun(gameData, partial[0], gameName);
  if (partial.length > 1) return { type: 'suggest', q, suggests: partial };
  const close = keys.map(k => ({k, d: lev(q, k)})).sort((a,b) => a.d-b.d).filter(x => x.d <= 2).map(x => x.k);
  if (close.length) return { type: 'typo', q, suggests: close };
  return { type: 'none', q };
}

function histChips(hist) {
  return hist.map((h, i) => {
    const gap = i > 0 && h.idx !== hist[i - 1].idx ? `<span class="rr-gap">${h.idx - hist[i - 1].idx}버전</span>` : '';
    const cls = h.st === 'future' ? 'rr-chip rr-future' : h.st === 'now' ? 'rr-chip rr-now' : 'rr-chip';
    return `${gap}<span class="${cls}" title="${fmt(h.hs)}–${fmt(h.he)}"><b>${h.v}</b> ${h.half} · ${h.type}${h.guess ? '?' : ''}</span>`;
  }).join('');
}

// 복각 대상이 아닌 캐릭터 분류 (SPECIAL_CHARS 키). list = 검색 결과에 보여줄 목록
const POOL_KINDS = ['standard', 'pickable', 'shop'];
const POOL_INFO = {
  standard: { status: '상시 캐릭터', msg: '해당 캐릭터는 상시 캐릭터입니다.',

    title: '상시 캐릭터', list: s => s.standard },
  pickable: { status: '별빛 인연의 초대 편입', msg: '해당 캐릭터는 별빛 인연의 초대(픽뚫 목록)에 추가된 캐릭터입니다.',
    why: '메인 뽑기에서 픽업을 놓쳤을 때 나올 캐릭터로 직접 지정할 수 있어서 복각할 일이 없어요.',
    title: '별빛 인연의 초대 목록', list: s => [...(s.standard || []), ...s.pickable] },
  shop: { status: '금빛 영혼 상점 편입', msg: '해당 캐릭터는 금빛 영혼 상점에서 교환할 수 있는 캐릭터입니다.',
    why: '6돌 이후 중복으로 얻는 은빛 영혼 2개를 금빛 영혼 1개로 바꿔 데려올 수 있어서 복각할 일이 없어요.',
    title: '금빛 영혼 상점', list: s => s.shop },
};

// 상시·픽뚫 목록·상점 캐릭터 검색 결과: 해당 목록 전체 초상화 + 안내
function renderPool(res, gameName) {
  const c = GAME_CONFIG[gameName], spec = SPECIAL_CHARS[gameName] || {}, info = POOL_INFO[res.kind];
  const list = info.list(spec), note = spec.notes?.[res.name];
  const pool = list.map(n => `<span class="rs-item${n === res.name ? ' on' : ''}" onclick="fillC('${n}','${gameName}')">
      ${portraitBox(gameName, n, 64)}<span class="rs-name">${n}</span></span>`).join('');
  return `<div class="rr-card" style="--ga:${c.a};--gb:${c.b};--gm:${c.m};--gp:${c.p};">
    <div class="rr-main">
      <div class="rr-left">${portraitWithAttrs(gameName, res.name, 112)}<p class="rr-name">${res.name}</p></div>
      <div class="rr-right">
        <p class="rr-status" style="color:var(--text2);">${info.status}</p>
        <p class="rr-sub">${info.msg}</p>
        <p class="rr-compare">${info.why}</p>
        ${note ? `<p class="rr-compare" style="color:var(--text);">${note}</p>` : ''}
      </div>
    </div>
    <div class="rr-hist"><p class="rr-hist-t">${gameName} ${info.title} ${list.length}명</p><div class="rs-grid">${pool}</div></div>
    ${res.hist.length ? `<div class="rr-hist" style="padding-top:0;"><p class="rr-hist-t">픽업 이력</p><div class="rr-chips">${histChips(res.hist)}</div></div>` : ''}
  </div>`;
}

// 복각 순위: 5성 픽업 캐릭터 중 (상시·픽뚫 목록·상점·무료 제외) 가장 오래 미복각 / 가장 많이 복각
function rerunRanks(gameData, gameName) {
  const spec = SPECIAL_CHARS[gameName] || {};
  const skip = new Set([...POOL_KINDS, 'free'].flatMap(k => spec[k] || []));
  const curIdx = gameData.reduce((m, v, i) => (pd(v.s) && pd(v.s) <= TODAY ? i : m), -1);
  const rows = Object.keys(allChars(gameData)).filter(k => {
    if (skip.has(k) || k.includes('(4성)')) return false;
    const p = portraitInfo(gameName, k);
    return !p || p.r === 5;
  }).map(k => {
    const hist = rerunHistory(gameData, k);
    const past = hist.filter(h => h.st === 'past'), last = past[past.length - 1];
    const now = hist.some(h => h.st === 'now'), next = hist.some(h => h.st === 'future');
    return { name: k, last, now, next,
      reruns: hist.filter(h => h.st !== 'future' && h.type === '복각').length,
      wait: last ? curIdx - last.idx : 0 };
  }).filter(r => r.last || r.now);
  // 동률은 같은 순위. 3명까지 보여주고 3위 안 동률이 더 있으면 more
  const top = (arr, val) => {
    const ranked = [];
    arr.forEach((r, i) => ranked.push({ ...r, rank: i && val(r) === val(arr[i - 1]) ? ranked[i - 1].rank : i + 1 }));
    return { list: ranked.slice(0, 3), more: ranked.filter(r => r.rank <= 3).length - Math.min(3, ranked.length) };
  };
  const waiting = rows.filter(r => !r.now && !r.next && r.wait > 0)
    .sort((a, b) => b.wait - a.wait || a.last.idx - b.last.idx);
  const most = [...rows].sort((a, b) => b.reruns - a.reruns || (b.last?.idx ?? 0) - (a.last?.idx ?? 0));
  return { waiting: top(waiting, r => r.wait), most: top(most, r => r.reruns) };
}

function renderRerunRanks(gameName) {
  const gd = GAMES[gameName];
  if (!gd) return '';
  const { waiting, most } = rerunRanks(gd, gameName);
  const row = (r, val, sub) => `<div class="rk-row" onclick="fillC('${r.name}','${gameName}');document.getElementById('ci-${gameName}').scrollIntoView({block:'center',behavior:'smooth'})">
      <span class="rk-no">${r.rank}</span>${portraitBox(gameName, r.name, 44)}
      <span class="rk-txt"><b>${r.name}</b><span>${sub}</span></span><span class="rk-val">${val}</span></div>`;
  const col = (title, t, fn) => `<div class="rk-col"><p class="rk-t">${title}</p>
      ${t.list.length ? t.list.map(fn).join('') : '<p class="rk-empty">해당 없음</p>'}
      ${t.more > 0 ? `<p class="rk-more">외 ${t.more}명 동률</p>` : ''}</div>`;
  return `<div class="rk-wrap">
    ${col('가장 오래 복각 안 한 캐릭터', waiting, r => row(r, `${r.wait}버전째`, `마지막 ${r.last.v} ${r.last.half}`))}
    ${col('가장 많이 복각한 캐릭터', most, r => row(r, `${r.reruns}회`, r.now ? '지금 픽업 중' : `마지막 ${r.last.v} ${r.last.half}`))}
  </div>
  <p class="rk-note">5성 픽업 캐릭터 기준 · 상시·픽뚫 목록·상점 캐릭터 제외 · 복각 예정이 잡힌 캐릭터는 '오래 복각 안 한' 순위에서 제외</p>`;
}

function renderResult(res, gameName) {
  const c = GAME_CONFIG[gameName];
  if (res.type === 'empty') return `<div class="result-box r-none"><p style="font-size:13px;color:var(--text2);">캐릭터 이름을 입력해주세요.</p></div>`;
  if (res.type === 'suggest' || res.type === 'typo') return `<div class="result-box r-error">
    <p style="font-size:13px;color:#633806;">${res.type === 'typo' ? `"${res.q}"와 비슷한 이름을 찾았어요.` : `"${res.q}"로 여러 캐릭터가 검색됐어요.`}</p>
    <div class="sug-list">${res.suggests.map(s => `<button class="sug-btn" onclick="fillC('${s}','${gameName}')">${s}</button>`).join('')}</div>
  </div>`;
  if (res.type === 'pool') return renderPool(res, gameName);
  if (res.type !== 'found') return `<div class="result-box r-none"><p style="font-size:13px;color:var(--text2);">"${res.q}"를 찾을 수 없어요.</p><p style="font-size:12px;color:var(--text3);margin-top:4px;">시트에 등록된 이름으로 검색해주세요.</p></div>`;

  const dday = d => { const n = Math.ceil((d - TODAY) / 86400000); return n <= 0 ? '오늘' : `D-${n}`; };
  const vh = h => `${h.v} ${h.half}`;
  let status, sub = [], tone = c.a;
  if (res.now) {
    status = `지금 픽업 중!`;
    sub.push(`${vh(res.now)} ${res.now.type} · 종료까지 ${dLeft(res.now.he)}일 (${fmt(res.now.he)})`);
  } else if (res.next) {
    const kind = res.next.type === '신규' ? '첫 픽업' : '복각';
    status = res.next.guess ? `${res.next.v}버전 ${kind} 예상` : `${res.next.v}버전 ${kind} 확정`;
    sub.push(`${vh(res.next)} · ${dday(res.next.hs)} (${fmt(res.next.hs)} 시작)${res.next.guess ? ' · 시트에 추측(?)으로 표시됨' : ''}`);
  } else if (res.last) {
    status = `${res.waitVers}버전째 미복각`;
    sub.push(`마지막 픽업 ${vh(res.last)} ${res.last.type} · ${res.daysSince}일 전`);
    if (res.estimate) sub.push(`빠르면 <b>${res.estimate.ver}버전</b>부터 복각 가능 (추정)`);
  } else {
    status = '등장 기록 없음';
  }
  // 평균 간격과 비교
  let compare = '';
  if (!res.now && !res.next && res.avgGap && res.last) {
    const diff = res.waitVers - res.avgGap;
    compare = diff >= 1 ? `평균 간격보다 <b>${diff.toFixed(1)}버전 더</b> 기다리는 중`
      : diff <= -1 ? `평균 간격까지 <b>${(-diff).toFixed(1)}버전</b> 남음` : '딱 평균 간격쯤이에요';
  }

  // 등장 이력 타임라인
  const chips = histChips(res.hist);
  const tail = !res.now && !res.next && res.last
    ? `<span class="rr-gap">${res.waitVers}버전</span><span class="rr-chip rr-wait">지금 · 대기 중</span>` : '';

  const p = portraitInfo(gameName, res.name);
  const facts = [
    `복각 <b>${res.rerunCount}</b>회`,
    res.avgGap ? `평균 간격 <b>${res.avgGap.toFixed(1)}</b>버전` : null,
    res.hist[0] ? `첫 등장 <b>${res.hist[0].v}</b>` : null,
  ].filter(Boolean).map(x => `<span>${x}</span>`).join('');

  return `<div class="rr-card" style="--ga:${c.a};--gb:${c.b};--gm:${c.m};--gp:${c.p};">
    <div class="rr-main">
      <div class="rr-left">${portraitWithAttrs(gameName, res.name, 112)}<p class="rr-name">${res.name}</p></div>
      <div class="rr-right">
        <p class="rr-status" style="color:${tone};">${status}</p>
        ${sub.map(x => `<p class="rr-sub">${x}</p>`).join('')}
        ${compare ? `<p class="rr-compare">${compare}</p>` : ''}
        <div class="rr-facts">${facts}</div>
      </div>
    </div>
    <div class="rr-hist"><p class="rr-hist-t">픽업 이력</p><div class="rr-chips">${chips}${tail}</div></div>
  </div>`;
}

// ── 페이지 렌더 ───────────────────────────────────────

let curTab = 'main';

function renderMain() {
  if (!scPageStart) {

    .filter(name => GAMES[name])
    .map(name => {

function getRegionInfo(regionMap, vStr) {
  const vNum = parseFloat(vStr);
  const major = Math.floor(vNum);
  const candidates = Object.keys(regionMap)
    .map(k => ({ key: k, num: parseFloat(k) }))
    .filter(({ num }) => num <= vNum && Math.floor(num) === major)
    .sort((a, b) => b.num - a.num);
  if (candidates.length > 0) return { label: regionMap[candidates[0].key], key: candidates[0].key };
  return { label: null, key: String(major) };
}

function renderTimelinePage(gameName) {
  const c = GAME_CONFIG[gameName];
  const vs = [...GAMES[gameName]].reverse();
  const regionMap = REGION_MAP[c.id] || {};

  vs.forEach(v => {
    const vStr = String(v.v).trim();
    const vNum = parseFloat(vStr);
    const major = Math.floor(vNum);
    const { label, key } = getRegionInfo(regionMap, vStr);
    if (key !== lastGroupKey) {
      lastGroupKey = key;
      const sepTitle = label || `${major}.x`;
      html += `<div class="tl-sep" style="--ga:${c.a};">
        <div class="tl-sep-bar"></div>
        <span class="tl-sep-label">${sepTitle}</span>

}

// ── 글로벌 매출 현황 ──────────────────────────────────
// 데이터: revenue.json (revenue.ennead.cc 월별 수치를 월 1회 수동 갱신, 지난 달도 계속 누적)
// 금액은 USD × 해당 월 평균 환율(fx)로 원화 환산해 보여준다.
const REV_GAMES = {
  '원신': GAME_CONFIG['원신'],
  '스타레일': GAME_CONFIG['스타레일'],
  '명조': GAME_CONFIG['명조'],
  '트릭컬': { a:'#D9577A', b:'#FDF0F3', m:'#F2B8C6', p:'#7A2E42', icon:'icon-trickcal.png' },
};
const REV_ORDER = ['원신', '스타레일', '명조', '트릭컬'];
let REVENUE = null;
let revGame = 'all';
let revPage = 0;   // 0 = 최신 구간, 1 = 그 이전 구간 ...

function revFx(m) {
  const fx = REVENUE.fx || {};
  if (fx[m]) return fx[m];
  const keys = Object.keys(fx).sort();
  return keys.length ? fx[keys[keys.length - 1]] : 1400;
}
function revKRW(game, m) {
  const usd = (REVENUE.games[game] || {})[m];
  return usd == null ? null : usd * revFx(m);
}
function fmtEok(n) { const e = n / 1e8; return e >= 100 ? Math.round(e).toLocaleString() : e.toFixed(1); }
function fmtKRW(n) { return `${fmtEok(n)}억원`; }
function mLabel(m, withYear) { const [y, mo] = m.split('-'); return withYear ? `${y.slice(2)}.${+mo}월` : `${+mo}월`; }
function prevMonth(m) { const [y, mo] = m.split('-').map(Number); return mo === 1 ? `${y - 1}-12` : `${y}-${String(mo - 1).padStart(2, '0')}`; }
function chgTag(cur, prev) {
  if (cur == null || !prev) return '<span style="color:var(--text3);">-</span>';
  const p = (cur - prev) / prev * 100, up = p >= 0;
  return `<span style="color:${up ? '#3B6D11' : '#A32D2D'};">${up ? '▲' : '▼'} ${Math.abs(p).toFixed(1)}%</span>`;
}
function revAllMonths() {
  const set = new Set();
  REV_ORDER.forEach(g => Object.keys(REVENUE.games[g] || {}).forEach(m => set.add(m)));
  return [...set].sort();
}
// 분기 목록 (최신순): [{ label, months:[3개] }]
function revQuarters() {
  const qs = [];
  revAllMonths().forEach(m => {
    const [y, mo] = m.split('-').map(Number), q = Math.ceil(mo / 3);
    const key = `${y}-${q}`;
    if (qs.length && qs[qs.length - 1].key === key) return;
    qs.push({ key, label: `${y}년 ${q}분기`, months: [0, 1, 2].map(i => `${y}-${String((q - 1) * 3 + 1 + i).padStart(2, '0')}`) });
  });
  return qs.reverse();
}
// 게임별 12개월 구간 (최신순)
function revYearWindows(game) {
  const ms = Object.keys(REVENUE.games[game] || {}).sort(), out = [];
  for (let end = ms.length; end > 0; end -= 12) out.push(ms.slice(Math.max(0, end - 12), end));
  return out;
}

// 해당 월에 걸쳐 있던 픽업 (버전 전반/후반 단위)
function revPickups(game, m) {
  const vs = GAMES[game];
  if (!vs) return null;
  const [y, mo] = m.split('-').map(Number);
  const ms = new Date(y, mo - 1, 1), me = new Date(y, mo, 1);
  const out = [];
  vs.forEach(v => {
    const s = pd(v.s), e = pd(v.e);
    if (!s || !e) return;
    const mid = addDays(s, 21);
    [['전반', s, mid, v.fn, v.fr], ['후반', mid, e, v.hn, v.hr]].forEach(([h, hs, he, n, r]) => {
      const os = hs > ms ? hs : ms, oe = he < me ? he : me;
      const days = Math.round((oe - os) / 86400000);
      if (days > 0) out.push({ ver: v.v, h, hs, he, days, n: sp(n), r: sp(r) });
    });
  });
  return out;
}

function revTipHTML(game, m) {
  const c = REV_GAMES[game], krw = revKRW(game, m), usd = (REVENUE.games[game] || {})[m];
  const [y, mo] = m.split('-');
  const head = `<div style="font-size:12px;color:${c.a};font-weight:700;margin-bottom:2px;">${game} · ${y}년 ${+mo}월</div>
    <div style="font-size:13px;font-weight:600;color:var(--text);">${krw == null ? '데이터 없음' : `약 ${fmtKRW(krw)}`}
      <span style="font-size:11px;font-weight:400;margin-left:4px;">${chgTag(krw, revKRW(game, prevMonth(m)))}</span></div>
    ${usd != null ? `<div style="font-size:10px;color:var(--text3);margin-bottom:8px;">$${(usd / 1e6).toFixed(1)}M · 환율 ${revFx(m).toLocaleString()}원</div>` : ''}`;
  const picks = revPickups(game, m);
  let body;
  if (!picks) body = `<div style="font-size:11px;color:var(--text3);">버전·픽업 정보가 없는 게임이에요.</div>`;
  else if (!picks.length) body = `<div style="font-size:11px;color:var(--text3);">이 달에 해당하는 버전 정보가 없어요.</div>`;
  else {
    // 이 달에서 차지한 일수 비중 → 가장 큰 구간 하이라이트, 신캐 없는 구간은 '복각만' 표시
    const dim = new Date(+y, +mo, 0).getDate();
    const top = picks.reduce((bi, p, i) => p.days > picks[bi].days ? i : bi, 0);
    const split = `<div style="display:flex;height:6px;border-radius:3px;overflow:hidden;gap:1px;margin-bottom:8px;background:var(--bg3);">
      ${picks.map((p, i) => `<div style="width:${p.days / dim * 100}%;background:${c.a};opacity:${i === top ? 1 : 0.3};"></div>`).join('')}</div>`;
    body = `<div style="font-size:10px;font-weight:600;color:var(--text2);margin-bottom:5px;border-top:0.5px solid var(--border);padding-top:7px;">이 달의 픽업 비중</div>` + split +
      picks.map((p, i) => {
        const isTop = i === top, pct = Math.round(p.days / dim * 100);
        const rerunOnly = !p.n.length && p.r.length;
        const tags = p.n.map(x => `<span class="pt-chip" style="background:${isTop ? 'var(--bg)' : c.b};color:${c.p};font-weight:600;">${portraitBox(game, x, 18)}${x}</span>`).join('') +
          p.r.map(x => `<span class="pt-chip" style="background:var(--bg3);color:var(--text2);">${portraitBox(game, x, 18)}${x}</span>`).join('');
        const badge = (txt, bg, fg) => `<span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:${bg};color:${fg};white-space:nowrap;">${txt}</span>`;
        return `<div style="margin-bottom:6px;padding:${isTop ? '7px 8px' : '2px 8px'};border-radius:6px;${isTop ? `background:${c.b};border-left:3px solid ${c.a};` : 'border-left:3px solid transparent;opacity:0.55;'}">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:3px;">
            <div style="font-size:11px;color:var(--text);"><b style="${isTop ? `color:${c.a};` : ''}">${p.ver} ${p.h}</b>
              <span style="font-weight:${isTop ? 700 : 400};color:${isTop ? c.a : 'var(--text3)'};margin-left:2px;">${pct}%</span>
              <div style="font-size:10px;color:var(--text3);">${fmt(p.hs)}–${fmt(p.he)} · 이 달 ${p.days}일</div></div>
            <div style="display:flex;gap:3px;flex-shrink:0;">${isTop ? badge('비중 최대', c.a, c.b) : ''}${rerunOnly ? badge('복각만', '#FAEEDA', '#854F0B') : ''}</div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:3px;">${tags || '<span style="font-size:10px;color:var(--text3);">정보 없음</span>'}</div>
        </div>`;
      }).join('');
  }
  return head + body;
}

function revNavHTML(label, total) {
  return `<div class="rev-nav">
    <button class="sc-btn" onclick="revNav(1)" ${revPage >= total - 1 ? 'disabled' : ''}>◀ 이전</button>
    <span class="rev-nav-lbl">${label}</span>
    <button class="sc-btn" onclick="revNav(-1)" ${revPage <= 0 ? 'disabled' : ''}>다음 ▶</button>
  </div>`;
}

function renderRevenue() {
  const btns = [
    `<button class="gc-game-btn${revGame === 'all' ? ' on' : ''}" onclick="setRevGame('all')"
      style="${revGame === 'all' ? 'border-color:var(--text);color:var(--text);background:var(--bg);font-weight:500;' : ''}">전체 보기</button>`,

  else body = revGame === 'all' ? renderRevAll() : renderRevGame(revGame);
  const note = REVENUE ? `<p class="rev-note">막대·칸에 마우스를 올리면(모바일은 탭) 그 달의 픽업 캐릭터가 보여요.<br>

function renderRevAll() {
  const qs = revQuarters();
  if (!qs.length) return '';
  revPage = Math.min(revPage, qs.length - 1);
  const q = qs[revPage], months = q.months;
  const vals = REV_ORDER.flatMap(n => months.map(m => revKRW(n, m) || 0));
  const max = Math.max(...vals, 1);
  const groups = months.map(m => `<div class="rev-group">
      <div class="rev-group-bars">${REV_ORDER.map(n => {
        const v = revKRW(n, m), c = REV_GAMES[n];
        return `<div class="rev-col" data-rg="${n}" data-rm="${m}">
          <span class="rev-val">${v == null ? '' : Math.round(v / 1e8)}</span>
          <div class="rev-bar" style="height:${v == null ? 0 : Math.max(2, v / max * 100)}%;background:${c.a};"></div>
        </div>`;
      }).join('')}</div>
      <span class="rev-mon">${mLabel(m)}</span>
    </div>`).join('');
  const legend = REV_ORDER.map(n => `<span class="rev-legend"><i style="background:${REV_GAMES[n].a};"></i>${n}</span>`).join('');
  const table = `<table class="rev-table">
    <thead><tr><th>게임</th>${months.map(m => `<th>${mLabel(m)}</th>`).join('')}<th>분기 합계</th></tr></thead>
    <tbody>${REV_ORDER.map(n => {
      const c = REV_GAMES[n];
      const cells = months.map(m => {
        const v = revKRW(n, m);
        return `<td data-rg="${n}" data-rm="${m}">${v == null ? '-' : `<b>${fmtEok(v)}</b><br><small>${chgTag(v, revKRW(n, prevMonth(m)))}</small>`}</td>`;
      }).join('');
      const sum = months.reduce((t, m) => t + (revKRW(n, m) || 0), 0);
      return `<tr>
        <td><a class="rev-game-link" onclick="setRevGame('${n}')"><img src="${c.icon}" class="tab-icon" onerror="this.style.display='none'"><span style="color:${c.a};font-weight:600;">${n}</span></a></td>
        ${cells}<td>${fmtEok(sum)}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
  return `${revNavHTML(`${q.label} (${months.map(m => +m.split('-')[1]).join('·')}월)`, qs.length)}
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px;">${legend}<span style="font-size:11px;color:var(--text3);margin-left:auto;">단위: 억원</span></div>
    <div class="rev-bars rev-bars-grouped">${groups}</div>
    ${table}`;
}

function renderRevGame(name) {
  const c = REV_GAMES[name], wins = revYearWindows(name);
  if (!wins.length) return `<div style="text-align:center;padding:20px 0;color:var(--text2);font-size:13px;">데이터가 없어요.</div>`;
  revPage = Math.min(revPage, wins.length - 1);
  const months = wins[revPage];
  const vals = months.map(m => revKRW(name, m)), max = Math.max(...vals);
  const last = months.length - 1, avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  const best = vals.indexOf(max);
  const stats = `<div class="r-stats" style="--gm:${c.m};margin-bottom:16px;">
    <div class="r-stat"><p class="r-num" style="color:${c.a};">${fmtEok(vals[last])}억</p><p class="r-lbl">${mLabel(months[last], true)} · ${chgTag(vals[last], revKRW(name, prevMonth(months[last])))}</p></div>
    <div class="r-stat"><p class="r-num" style="color:${c.a};">${fmtEok(avg)}억</p><p class="r-lbl">${months.length}개월 평균</p></div>
    <div class="r-stat"><p class="r-num" style="color:${c.a};">${fmtEok(max)}억</p><p class="r-lbl">최고 · ${mLabel(months[best], true)}</p></div>
  </div>`;
  const bars = months.map((m, i) => `<div class="rev-col" data-rg="${name}" data-rm="${m}">
      <span class="rev-val" style="${i === best ? `color:${c.a};font-weight:600;` : ''}">${Math.round(vals[i] / 1e8)}</span>
      <div class="rev-bar" style="height:${Math.max(2, vals[i] / max * 100)}%;background:${c.a};opacity:${i === last ? 1 : 0.4};"></div>
      <span class="rev-mon">${mLabel(m)}</span>

// 목표 n개를 얻기까지 총 뽑기 수 분포 P(T=t) (정확 DP)
// 상태: 현재 스택, 확정 여부, 포착의 빛 연속 실패 카운터(원신 캐릭터), 획득 수
function gcDist(cfg, n, pity, guar) {
  const H = cfg.hard, C = cfg.capture ? 4 : 1;
  const rate = new Float64Array(H + 1);
  for (let p = 1; p <= H; p++) rate[p] = p >= H ? 1 : p < cfg.soft ? cfg.base : Math.min(1, cfg.base + cfg.incr * (p - cfg.soft + 1));
  const S = n * 2 * C * H, ix = (k, g, c, p) => ((k * 2 + g) * C + c) * H + p;
  let cur = new Float64Array(S);
  cur[ix(0, guar ? 1 : 0, 0, Math.min(pity, H - 1))] = 1;
  const out = [0];
  let alive = 1;
  for (let t = 1; alive > 1e-9 && t < 3000; t++) {
    const nx = new Float64Array(S);
    let done = 0;
    for (let k = 0; k < n; k++) for (let g = 0; g < 2; g++) for (let c = 0; c < C; c++) for (let p = 0; p < H; p++) {
      const q = cur[ix(k, g, c, p)];
      if (!q) continue;
      const r = rate[p + 1], q5 = q * r;
      if (r < 1) nx[ix(k, g, c, p + 1)] += q - q5;
      // 5성 획득
      const win = g ? 1 : (cfg.capture && c === 3) ? 1 : cfg.win;
      const qw = q5 * win, ql = q5 - qw;
      const c2 = g ? c : 0;   // 확정 획득은 카운터 유지, 50/50 승리(포착 포함)는 초기화
      if (k + 1 === n) done += qw; else nx[ix(k + 1, 0, c2, 0)] += qw;
      if (ql) nx[ix(k, 1, Math.min(c + 1, C - 1), 0)] += ql;
    }
    out.push(done);
    alive -= done;
    cur = nx;
  }
  return out;
}

// 최악(천장만 계속): 매번 천장까지, 확정이 아니면 50/50도 짐
function gcWorst(cfg, n, pity, guar) {
  let t = 0, k = 0, g = guar, c = 0, first = true;
  while (k < n) {
    t += first ? cfg.hard - Math.min(pity, cfg.hard - 1) : cfg.hard;
    first = false;
    if (g || cfg.win >= 1 || (cfg.capture && c === 3)) { k++; if (!g) c = 0; g = false; }
    else { g = true; c++; }
  }
  return t;
}

function gcStats(dist) {
  let mean = 0, acc = 0, q50 = 0, q90 = 0;
  const cdf = new Float64Array(dist.length);
  for (let t = 1; t < dist.length; t++) {
    mean += t * dist[t]; acc += dist[t]; cdf[t] = acc;
    if (!q50 && acc >= 0.5) q50 = t;
    if (!q90 && acc >= 0.9) q90 = t;
  }
  return { mean: Math.round(mean), q50, q90, cdf };
}
function gcCdfAt(cdf, t) { return t <= 0 ? 0 : t >= cdf.length ? 1 : cdf[t]; }

// 현재 스택에서 다음 5성까지 k뽑 안에 나올 누적 확률
function gcFirst5Cdf(cfg, pity, kMax) {
  const cdf = [0];
  let none = 1;
  for (let k = 1; k <= kMax; k++) {
    const p = pity + k, r = p >= cfg.hard ? 1 : p < cfg.soft ? cfg.base : Math.min(1, cfg.base + cfg.incr * (p - cfg.soft + 1));
    none *= 1 - r;
    cdf.push(1 - none);
  }
  return cdf;
}
function gcRate(cfg, p) { return p >= cfg.hard ? 1 : p < cfg.soft ? cfg.base : Math.min(1, cfg.base + cfg.incr * (p - cfg.soft + 1)); }
function gcPct(x) { const v = x * 100; return v >= 99.95 ? '100' : v > 0 && v < 0.1 ? '0.1 미만' : v.toFixed(v >= 10 ? 0 : 1); }

  if (pityHint) pityHint.textContent = `0~${cfg.hard - 1} (${cfg.hard}뽑째 확정)`;

        <li>${cfg.win >= 1 ? '<b>목표 ' + (isW ? '재련' : '돌파') + '</b>만 고르면 끝!' : `<b>목표 ${isW ? '재련' : '돌파'}</b>${isW ? '이랑' : '랑'} <b>천장 상태</b>도 골라 줘. 직전 5성이 픽업이 아니었으면 ${gcGame === 'genshin' && isW ? '운명 포인트 1' : '확천장'}이야.`}</li>

  const succ = gcCdfAt(st.cdf, avail);

  const gc = GAME_CONFIG[g.name] || {}, ac = gc.a || '#BA7517';
