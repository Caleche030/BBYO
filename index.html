<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임 버전 트래커</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg2: #f5f5f3;
    --bg3: #eeede9;
    --text: #1a1a1a;
    --text2: #666660;
    --text3: #999994;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --radius: 10px;
    --radius-lg: 14px;
  }

  body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: var(--bg2);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── 헤더 ── */
  header {
    background: var(--bg);
    border-bottom: 0.5px solid var(--border);
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 0;
  }
  .site-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    padding: 16px 20px 16px 0;
    margin-right: 16px;
    border-right: 0.5px solid var(--border);
    white-space: nowrap;
  }
  .tabs {
    display: flex;
    overflow-x: auto;
    gap: 0;
  }
  .tab-btn {
    padding: 18px 18px;
    background: none;
    border: none;
    border-bottom: 2.5px solid transparent;
    font-size: 14px;
    font-weight: 400;
    color: var(--text2);
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: color 0.15s;
  }
  .tab-btn.active { font-weight: 500; }

  /* ── 컨텐츠 ── */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 24px;
  }

  /* ── 로딩 ── */
  .loading {
    text-align: center;
    padding: 80px 0;
    color: var(--text3);
    font-size: 14px;
  }
  .loading-dot {
    display: inline-block;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

  /* ── 메인 그리드 ── */
  .main-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
  }
  .section-label {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 16px;
  }

  /* ── 버전 카드 ── */
  .vcard {
    background: var(--bg);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-lg);
    padding: 20px;
    border-left: 4px solid var(--ga);
  }
  .vc-game { font-size: 11px; color: var(--text3); margin-bottom: 4px; letter-spacing: 0.05em; text-transform: uppercase; }
  .vc-ver  { font-size: 22px; font-weight: 600; color: var(--ga); line-height: 1.1; }
  .vc-dates{ font-size: 13px; color: var(--text2); margin-top: 3px; margin-bottom: 16px; }
  .game-icon-lg { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
  .tab-icon { width: 18px; height: 18px; border-radius: 4px; object-fit: cover; vertical-align: middle; margin-right: 5px; }

  .ph-section { margin-bottom: 14px; }
  .ph-section:last-of-type { margin-bottom: 0; }
  .ph-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 7px; }
  .ph-title { font-size: 14px; font-weight: 600; color: var(--text2); }
  .ph-title.active { color: var(--ga); }
  .ph-countdown { font-size: 12px; color: var(--text3); }
  .ph-countdown.active { color: var(--ga); }
  .ph-tags { display: flex; flex-wrap: wrap; gap: 5px; }

  .tag-n { font-size: 12px; padding: 3px 10px; border-radius: 5px; background: var(--gb); color: var(--gp); font-weight: 500; }
  .tag-r { font-size: 12px; padding: 3px 10px; border-radius: 5px; background: var(--bg3); color: var(--text2); }
  .tag-empty { font-size: 12px; color: var(--text3); font-style: italic; }
  .tag-memo { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--bg3); color: var(--text2); border: 0.5px solid var(--border); }

  .card-divider { height: 0.5px; background: var(--border); margin: 14px 0; }
  .next-lbl { font-size: 11px; color: var(--text3); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
  .next-ver { font-size: 13px; font-weight: 600; color: var(--text); }
  .next-dates { font-size: 12px; color: var(--text2); margin-left: 5px; }

  /* ── 서브탭 ── */
  .sub-tabs {
    display: flex;
    margin-bottom: 20px;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    overflow: hidden;
    width: fit-content;
    background: var(--bg3);
  }
  .sub-btn {
    padding: 8px 22px;
    background: none;
    border: none;
    font-size: 13px;
    color: var(--text2);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }
  .sub-btn.on { font-weight: 500; border-radius: calc(var(--radius) - 1px); }

  /* ── 복각 계산기 ── */
  .calc-box {
    background: var(--bg);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-top: 14px;
  }
  .calc-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
  .calc-desc  { font-size: 12px; color: var(--text2); margin-bottom: 14px; }
  .calc-row   { display: flex; gap: 8px; }
  .calc-input {
    flex: 1;
    padding: 9px 13px;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .calc-input:focus { border-color: var(--ga); }
  .calc-btn {
    padding: 9px 20px;
    border: none;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .calc-btn:hover { opacity: 0.85; }
  .result-box { margin-top: 14px; padding: 16px; border-radius: var(--radius); }
  .r-found { background: var(--gb); border: 0.5px solid var(--gm); }
  .r-error  { background: #FEF3E0; border: 0.5px solid #FAC775; }
  .r-none   { background: var(--bg3); border: 0.5px solid var(--border); }
  .r-char { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .r-stats { display: flex; border: 0.5px solid var(--gm); border-radius: var(--radius); overflow: hidden; }
  .r-stat { flex: 1; padding: 12px 0; text-align: center; background: var(--bg); }
  .r-stat + .r-stat { border-left: 0.5px solid var(--gm); }
  .r-num { font-size: 24px; font-weight: 600; }
  .r-lbl { font-size: 11px; color: var(--text2); margin-top: 3px; }
  .r-sub { font-size: 12px; color: var(--text2); margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--gm); }
  .sug-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .sug-btn {
    font-size: 12px; padding: 4px 12px;
    border: 0.5px solid var(--border2); border-radius: 20px;
    background: var(--bg); cursor: pointer; font-family: inherit; color: var(--text);
  }
  .sug-btn:hover { background: var(--bg3); }

  /* ── 타임라인 ── */
  .tl-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .tl-accent-bar { width: 4px; height: 22px; border-radius: 2px; }
  .tl-game-title { font-size: 16px; font-weight: 600; color: var(--text); }
  .tl-sort-lbl { font-size: 12px; color: var(--text3); }

  .timeline { position: relative; padding-left: 32px; }
  .tl-line { position: absolute; left: 8px; top: 0; bottom: 0; width: 1px; background: var(--border2); }
  .tl-item { position: relative; margin-bottom: 10px; }
  .tl-dot { position: absolute; border-radius: 50%; transform: translateX(-50%); left: 8px; }
  .tl-card { border-radius: var(--radius); padding: 13px 15px; }
  .tl-current { background: var(--gb); border: 0.5px solid var(--gm); }
  .tl-future  { background: var(--bg); border: 0.5px solid var(--border); }
  .tl-past    { background: var(--bg); border: 0.5px solid var(--border); opacity: 0.65; }
  .tl-sep { display:flex; align-items:center; gap:10px; margin:32px 0 14px; }
  .tl-sep-bar { width:4px; height:20px; border-radius:2px; background:var(--ga); flex-shrink:0; }
  .tl-sep-label { font-size:16px; font-weight:700; color:var(--ga); }
  .tl-sep-line { flex:1; height:1px; background:var(--border); }
  .tl-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .tl-ver { font-size: 15px; font-weight: 600; }
  .tl-dates { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .tl-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .tl-ph-title { font-size: 13px; font-weight: 600; margin: 9px 0 5px; }
  .tl-ph-title.active { color: var(--ga); }
  .tl-ph-title.dim    { color: var(--text2); }

  /* ── 범례 ── */
  .legend { display: flex; gap: 8px; align-items: center; margin-top: 16px; flex-wrap: wrap; }

  /* ── 에러 ── */
  .error-box { background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius-lg); padding: 40px; text-align: center; color: var(--text2); font-size: 14px; }

  @media (max-width: 600px) {
    main { padding: 20px 16px; }
    header { padding: 0 16px; }
    .site-title { display: none; }
  }

  /* ── 가챠 계산기 ── */
  .gc-game-btn { display:flex; align-items:center; gap:8px; padding:7px 14px; border:1.5px solid var(--border2); border-radius:var(--radius); background:var(--bg2); cursor:pointer; font-family:inherit; font-size:14px; color:var(--text2); transition:all 0.15s; }
  .gc-game-btn img { width:28px; height:28px; border-radius:6px; display:block; }
  .gc-seg { display:flex; border:0.5px solid var(--border2); border-radius:var(--radius); overflow:hidden; background:var(--bg3); width:fit-content; }
  .gc-seg button { padding:7px 13px; background:none; border:none; font-size:13px; color:var(--text2); cursor:pointer; font-family:inherit; white-space:nowrap; }
  .gc-seg button.on { background:var(--gc-a,#BA7517); color:var(--gc-b,#FEF3E0); font-weight:500; }
  .gc-inp { padding:8px 10px; border:0.5px solid var(--border2); border-radius:var(--radius); font-size:14px; font-family:inherit; background:var(--bg); color:var(--text); outline:none; }
  .gc-inp:focus { border-color:var(--gc-a,#BA7517); }
  .gc-go { width:100%; padding:11px; border:none; border-radius:var(--radius); font-size:14px; font-weight:500; cursor:pointer; font-family:inherit; transition:opacity 0.15s; }
  .gc-go:hover { opacity:0.85; }
  .gc-stat { background:var(--bg2); border-radius:var(--radius); padding:10px 4px; text-align:center; }

  /* ── 비교 탭 스크러버 ── */
  .sc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .sc-title  { font-size: 15px; font-weight: 600; }
  .sc-btn    { padding: 6px 14px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); font-size: 12px; font-family: inherit; cursor: pointer; color: var(--text2); transition: background 0.12s; }
  .sc-btn:hover { background: var(--bg3); }
  .sc-btn.today { border-color: #e53e3e; color: #e53e3e; }
  .sc-date-lbl { font-size: 14px; font-weight: 700; color: #e53e3e; margin-left: auto; }
  .sc-outer  { background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius-lg); overflow: hidden; }
  .sc-layout { display: flex; }
  .sc-label-col  { width: 58px; flex-shrink: 0; border-right: 0.5px solid var(--border); }
  .sc-label-cell { height: 44px; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; font-size: 11px; font-weight: 600; border-bottom: 0.5px solid var(--border); }
  .sc-label-ruler { height: 60px; }
  .sc-viewport { flex: 1; position: relative; overflow: hidden; cursor: grab; user-select: none; -webkit-user-select: none; }
  .sc-viewport.grabbing { cursor: grabbing; }
  .sc-track   { position: absolute; top: 0; left: 0; will-change: transform; }
  .sc-bar-row { position: relative; height: 44px; border-bottom: 0.5px solid var(--border); }
  .sc-bar     { position: absolute; top: 7px; bottom: 7px; border-radius: 4px; display: flex; align-items: center; padding: 0 7px; font-size: 10px; white-space: nowrap; overflow: hidden; transition: box-shadow 0.1s; }
  .sc-ruler   { position: relative; height: 60px; border-top: 0.5px solid var(--border2); }
  .sc-redline { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #e53e3e; pointer-events: none; z-index: 10; transform: translateX(-50%); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <p class="site-title">BBYO</p>
    <div class="tabs" id="tabs"></div>
  </div>
</header>

<main id="main">
  <div class="loading">
    <span class="loading-dot" style="animation-delay:0s">●</span>&nbsp;
    <span class="loading-dot" style="animation-delay:0.2s">●</span>&nbsp;
    <span class="loading-dot" style="animation-delay:0.4s">●</span>
    <p style="margin-top:12px;">시트 데이터 불러오는 중...</p>
  </div>
</main>

<script>
// ── 설정 ──────────────────────────────────────────────
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTyz6c92R-LC6sF8uNb5HPpHkZsjkHZXJoO6J8kmyjR84hAzrOyiX-bUmuPRJhXVSbUk8-TOm8FFM0p/pub?output=csv';

const GAME_CONFIG = {
  '원신':     { id:'genshin',   a:'#0D9488', b:'#F0FDFA', m:'#5EEAD4', p:'#115E59', icon:'icon-genshin.png' },
  '명조':     { id:'wuwa',      a:'#A8A010', b:'#F7F6E0', m:'#C0B820', p:'#1A1A08', icon:'icon-wuwa.png' },
  '붕스':     { id:'starrail',  a:'#A07C1A', b:'#FEF9E8', m:'#C8A02A', p:'#1A2E5A', icon:'icon-starrail.png' },
  '엔드필드': { id:'endfield',  a:'#C86820', b:'#FFF3E8', m:'#D87830', p:'#5A5A64', icon:'icon-endfield.png' },
};
const GAME_ORDER = ['원신', '붕스', '명조', '엔드필드'];

const REGION_MAP = {
  genshin:  { '1':'몬드 & 리월', '2':'이나즈마', '3':'수메르', '4':'폰타인', '5':'나타', '6':'노드크라이', '7':'스네즈나야' },
  starrail: { '1':'우주 정거장 · 야릴로Ⅵ · 선주 나부', '2':'페나코니 · 선주 나부', '3':'엠포리어스 · 페나코니', '4':'이상 낙원' },
  wuwa:     { '1':'금주', '2':'리나시타', '3':'라하이로이', '3.6':'몽주' },
  endfield: { '1':'4번협곡 · 무릉성' },
};

// ── 유틸 ──────────────────────────────────────────────
const TODAY = new Date();
TODAY.setHours(0,0,0,0);

function pd(s) {
  if (!s) return null;
  const clean = s.replace(/\./g, '/').trim();
  const [y, m, d] = clean.split('/');
  if (!y || !m || !d) return null;
  return new Date(+y, +m - 1, +d);
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function fmt(d) { if (!d) return '?'; return `${d.getMonth()+1}/${String(d.getDate()).padStart(2,'0')}`; }
function dLeft(d) { return Math.max(0, Math.ceil((d - TODAY) / 86400000)); }
function sp(s) { return s ? s.split('/').map(n => n.trim()).filter(Boolean) : []; }

function getPhase(v) {
  const s = pd(v.s), e = pd(v.e);
  if (!s || !e) return { st: 'unknown' };
  const mid = addDays(s, 21);
  if (TODAY < s) return { st: 'future', mid };
  if (TODAY >= e) return { st: 'past', mid };
  return { st: 'current', half: TODAY < mid ? '전반' : '후반', mid, end: e };
}

// ── CSV 파싱 ──────────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  let cur = '', inQ = false, row = [];
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') {
      if (inQ && text[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (ch === ',' && !inQ) {
      row.push(cur.trim()); cur = '';
    } else if ((ch === '\n' || ch === '\r') && !inQ) {
      if (ch === '\r' && text[i+1] === '\n') i++;
      row.push(cur.trim()); cur = '';
      if (row.some(c => c)) rows.push(row);
      row = [];
    } else {
      cur += ch;
    }
  }
  if (cur || row.length) { row.push(cur.trim()); if (row.some(c=>c)) rows.push(row); }
  return rows;
}

function buildGameData(rows) {
  const games = {};
  let curGame = null;

  rows.forEach(row => {
    const [g, ver, s, e, fn, fr, hn, hr, memo] = row;
    // 헤더 행 스킵
    if (ver === '버전' || ver === '시작 날짜') return;
    // 게임명 행
    if (g && GAME_CONFIG[g]) { curGame = g; }
    if (!curGame) return;
    if (!ver || !s) return;

    if (!games[curGame]) games[curGame] = [];
    games[curGame].push({
      v: ver,
      s: s.replace(/\./g, '/'),
      e: e ? e.replace(/\./g, '/') : '',
      fn: fn || '', fr: fr || '',
      hn: hn || '', hr: hr || '',
      memo: memo || ''
    });
  });
  return games;
}

// ── 렌더 헬퍼 ─────────────────────────────────────────
function nt(arr) { return arr.map(n => `<span class="tag-n">${n}</span>`).join(''); }
function rt(arr) { return arr.map(n => `<span class="tag-r">${n}</span>`).join(''); }

function phSection(title, isActive, countdown, fnA, frA) {
  const hasChars = fnA.length || frA.length;
  return `<div class="ph-section">
    <div class="ph-head">
      <span class="ph-title${isActive ? ' active' : ''}">${title}</span>
      ${countdown ? `<span class="ph-countdown${isActive ? ' active' : ''}">${countdown}</span>` : ''}
    </div>
    <div class="ph-tags">${hasChars ? (nt(fnA) + rt(frA)) : '<span class="tag-empty">정보 없음</span>'}</div>
  </div>`;
}

function renderVersionCard(gameName, v, showNext, nxt) {
  const c = GAME_CONFIG[gameName];
  const info = getPhase(v);
  const s = pd(v.s), e = pd(v.e), mid = info.mid || (s ? addDays(s, 21) : null);
  const fnA = sp(v.fn), frA = sp(v.fr), hnA = sp(v.hn), hrA = sp(v.hr);
  const f1cd = info.st === 'current' && info.half === '전반' ? `종료까지 ${dLeft(mid)}일` : '';
  const f2cd = info.st === 'current' && info.half === '후반' ? `종료까지 ${dLeft(e)}일` : '';

  let nxtHtml = '';
  if (showNext && nxt) {
    const ns = pd(nxt.s), ne = pd(nxt.e);
    const nfn = sp(nxt.fn), nfr = sp(nxt.fr), nhn = sp(nxt.hn), nhr = sp(nxt.hr);
    const nhF = nfn.length || nfr.length, nhB = nhn.length || nhr.length;
    nxtHtml = `<div class="card-divider"></div>
      <p class="next-lbl">다음 버전</p>
      <p style="margin-bottom:8px;"><span class="next-ver">${nxt.v}버전</span><span class="next-dates">(${fmt(ns)} – ${fmt(ne)})</span></p>
      ${nhF ? phSection('전반', false, '', nfn, nfr) : ''}
      ${nhB ? phSection('후반', false, '', nhn, nhr) : ''}`;
  }

  return `<div class="vcard" style="--ga:${c.a};--gb:${c.b};--gm:${c.m};--gp:${c.p};">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
      ${c.icon ? `<img src="${c.icon}" class="game-icon-lg" onerror="this.style.display='none'">` : ''}
      <div><p class="vc-game">${gameName}</p><p class="vc-ver">${v.v}버전</p></div>
    </div>
    <p class="vc-dates">(${fmt(s)} – ${fmt(e)})</p>
    ${phSection('전반', info.half === '전반', f1cd, fnA, frA)}
    <div class="card-divider"></div>
    ${phSection('후반', info.half === '후반', f2cd, hnA, hrA)}

function lev(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1}, (_, i) => Array.from({length:n+1}, (_, j) => i ? j ? 0 : i : j));
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n];
}

function allChars(gameData) {
  const map = {};
  gameData.forEach((v, idx) => {
    ['fn', 'hn'].forEach(k => {
      sp(v[k]).forEach(name => {
        const key = name.replace(/\?/g, '').trim();
        if (!key) return;
        if (!map[key]) map[key] = { last: {idx, v: v.v, end: v.e}, rerunCount: 0 };
        else map[key].last = { idx, v: v.v, end: v.e };
      });
    });
    ['fr', 'hr'].forEach(k => {
      sp(v[k]).forEach(name => {
        const key = name.replace(/\?/g, '').trim();
        if (!key) return;
        if (!map[key]) map[key] = { last: {idx, v: v.v, end: v.e}, rerunCount: 1 };
        else { map[key].last = {idx, v: v.v, end: v.e}; map[key].rerunCount++; }
      });
    });
  });
  return map;
}

function calcRerun(gameData, q) {
  q = q.trim();
  if (!q) return { type: 'empty' };
  const chars = allChars(gameData), keys = Object.keys(chars);
  const exact = keys.find(k => k === q);
  if (exact) {
    const info = chars[exact];
    const lastEnd = pd(info.last.end);
    const daysSince = lastEnd ? Math.max(0, Math.floor((TODAY - lastEnd) / 86400000)) : 0;
    const pastVers = gameData.slice(info.last.idx + 1).filter(v => { const s = pd(v.s); return s && s <= TODAY; }).length;
    return { type: 'found', name: exact, lastV: info.last.v, lastEnd: info.last.end, daysSince, pastVers, rerunCount: info.rerunCount };
  }
  const partial = keys.filter(k => k.includes(q) || q.includes(k));
  if (partial.length === 1) return calcRerun(gameData, partial[0]);
  if (partial.length > 1) return { type: 'suggest', q, suggests: partial };
  const close = keys.map(k => ({k, d: lev(q, k)})).sort((a,b) => a.d-b.d).filter(x => x.d <= 2).map(x => x.k);
  if (close.length) return { type: 'typo', q, suggests: close };
  return { type: 'none', q };
}

function gcProb(pity, pulls, cfg) {
  if (pulls <= 0) return 0;
  let none = 1;
  for (let i = 0; i < pulls; i++) {
    const p = pity + i + 1;
    const r = p < cfg.soft ? cfg.base : p < cfg.hard ? cfg.base + cfg.incr * (p - cfg.soft + 1) : 1;
    none *= (1 - Math.min(1, r));
    if (none < 0.0001) break;
  }
  return (1 - none) * 100;
}

function gcAvgRem(pity, cfg) {
  return pity <= cfg.soft
    ? Math.max(1, Math.round(cfg.avg - pity * (cfg.avg / cfg.hard)))
    : Math.max(1, Math.round((cfg.hard - cfg.soft) / 2 - (pity - cfg.soft) * 0.6));
}

}

window.gcDoCalc = function() {
  const g = GC_CFG[gcGame]; if (!g || !g.ready) return;
  const gc = GAME_CONFIG[g.name] || {}, ac = gc.a||'#BA7517', bc = gc.b||'#FEF3E0';
  const isW = gcGetSeg('gc-bt') === '무기', guar = gcGetSeg('gc-gur'), cfg = isW ? g.w : g.c;
  const pity = Math.min(parseInt(document.getElementById('gc-pity').value)||0, cfg.hard-1);
  const gems = parseInt(document.getElementById('gc-gems').value)||0;
  const fates = parseInt(document.getElementById('gc-fates').value)||0;
  const cstr = gcGetSeg('gc-cop');
  const n = isW ? parseInt(cstr.replace('R','')) : parseInt(cstr.replace('C',''))+1;
  const avail = Math.floor(gems/g.gpp) + fates;

  const best  = isW ? gcWeapBest(n, pity, cfg)       : gcCharBest(n, pity, cfg);
  const avg   = isW ? gcWeapAvg(n, guar, pity, cfg)  : gcCharAvg(n, guar, pity, cfg);
  const worst = isW ? gcWeapWorst(n, guar, pity, cfg): gcCharWorst(n, guar, pity, cfg);

  let st = avail >= worst ? GC_ST[0] : avail >= avg ? GC_ST[1] : avail >= Math.round(avg*0.6) ? GC_ST[2] : GC_ST[3];
  const {k, sc, sb, sp, img, msg} = st;

  const dAvg = Math.max(0, avg-avail), dWorst = Math.max(0, worst-avail);
  const sAvg = Math.max(0, avail-avg), sWorst = Math.max(0, avail-worst);
  const tAvg = dAvg>0 ? Math.ceil(dAvg*160/8080) : 0, tWorst = dWorst>0 ? Math.ceil(dWorst*160/8080) : 0;

  const wr = isW && cfg.fatepoint
    ? (guar==='운명 포인트 1'?0.75:0.375)
    : (guar==='확 천장'?1.0:cfg.win);
  const p10s = Math.round(gcProb(pity,10,cfg)), p10p = Math.round(p10s*wr);
  const pAs  = Math.round(gcProb(pity,avail,cfg)), pAp = Math.round(pAs*wr);
  const pNext = gcProb(pity,1,cfg), pNextP = (pNext*wr).toFixed(1), pNext5 = pNext.toFixed(1);
  const enoughNext = avail >= best;

  function sbox(lbl, val, isCur) {
    const ok = avail >= val;
    const tc = isCur ? (ok?sc:'#A32D2D') : ok?sc:'var(--text2)';
    const brd = isCur && ok ? `border:1.5px solid ${sc};` : '';
    return `<div class="gc-stat" style="${brd}">
      <p style="font-size:16px;font-weight:500;color:${tc};">${val}</p>
      <p style="font-size:10px;color:var(--text2);margin-top:2px;">${lbl}</p>
      <p style="font-size:11px;margin-top:2px;color:${ok?sc:'#A32D2D'};">${ok?'✓':'✗'}</p>
    </div>`;
  }
  const nextBox = `<div class="gc-stat">
    <p style="font-size:16px;font-weight:500;color:${sc};">${pNextP}%</p>
    <p style="font-size:10px;color:var(--text2);margin-top:2px;">다음 1뽑</p>
    <p style="font-size:10px;color:var(--text3);margin-top:2px;">5성 ${pNext5}%</p>
  </div>`;

  function costBox(lbl, def, trucks, sur, isAvg) {
    const bg=isAvg?sb:'var(--bg2)', tc=isAvg?sp:'var(--text)', subc=isAvg?sc:'var(--text2)';
    return def>0
      ? `<div style="flex:1;min-width:130px;background:${bg};border-radius:var(--radius);padding:11px 12px;">
          <p style="font-size:10px;color:${subc};margin-bottom:3px;">${lbl}</p>
          <p style="font-size:17px;font-weight:500;color:${tc};">${def}뽑 부족</p>
          <p style="font-size:12px;color:${subc};margin-top:2px;">${trucks}트럭 · ${(trucks*g.truckWon).toLocaleString()}원</p>
        </div>`
      : `<div style="flex:1;min-width:130px;background:${bg};border-radius:var(--radius);padding:11px 12px;">
          <p style="font-size:10px;color:${subc};margin-bottom:3px;">${lbl}</p>
          <p style="font-size:17px;font-weight:500;color:${isAvg?tc:'#3B6D11'};">${sur}뽑 여유</p>
          <p style="font-size:12px;color:${subc};margin-top:2px;">추가 과금 없음</p>
        </div>`;
  }

  document.getElementById('gc-res').innerHTML = `
  <div style="background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius-lg);overflow:hidden;">
    <div style="display:flex;align-items:center;justify-content:center;gap:18px;padding:18px 20px;">
      <img src="${img}" style="width:90px;height:90px;border-radius:10px;object-fit:cover;object-position:top;flex-shrink:0;"
        onerror="this.style.display='none'">
      <div>
        <p style="font-size:22px;font-weight:600;color:${sc};margin-bottom:4px;">${k}</p>
        <p style="font-size:13px;color:var(--text2);">${msg}</p>
      </div>
    </div>
    <div style="height:0.5px;background:var(--border);"></div>
    <div style="padding:13px 15px;">
      <p style="font-size:12px;color:var(--text2);margin-bottom:8px;">시나리오별 필요 뽑기</p>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:5px;">
        ${sbox('최선',best,false)}${sbox('평균',avg,false)}${sbox('최악',worst,false)}${sbox('현재 보유',avail,true)}${nextBox}
      </div>
    </div>
    <div style="height:0.5px;background:var(--border);"></div>
    <div style="padding:12px 15px;">
      <p style="font-size:12px;color:var(--text2);margin-bottom:10px;">보유 뽑기 위치</p>
      ${gcZoneBar(best,avg,worst,avail)}

    <div style="padding:12px 15px;display:flex;gap:8px;flex-wrap:wrap;">
      ${costBox('평균 기준',dAvg,tAvg,sAvg,true)}${costBox('최악 기준',dWorst,tWorst,sWorst,false)}
    </div>
    <div style="height:0.5px;background:var(--border);"></div>
    <div style="padding:10px 15px;background:var(--bg2);display:flex;gap:20px;flex-wrap:wrap;">
      <div>

};

// ── 비교 탭 스크러버 ──────────────────────────────────
const PX_DAY = 28;
const PAGE_DAYS = 84;
let scPageStart = null;
let scTX = 0;
let scDragHandlers = null;

function daysBetween(a, b) { return Math.round((b - a) / 86400000); }

function scGetDate() {
  const vp = document.getElementById('sc-vp');
  if (!vp) return new Date(TODAY);
  const W = vp.getBoundingClientRect().width;
  const idx = (W / 2 - scTX) / PX_DAY;
  const d = new Date(scPageStart);
  d.setDate(d.getDate() + Math.round(idx));
  return d;
}

function scApply() {
  const track = document.getElementById('sc-track');
  if (track) track.style.transform = `translateX(${Math.round(scTX)}px)`;
}

function scUpdateDate() {
  const d = scGetDate();
  const el = document.getElementById('sc-date-lbl');
  if (el) el.textContent = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  GAME_ORDER.forEach(name => {
    (GAMES[name] || []).forEach((v, i) => {
      const bar = document.getElementById(`scb-${name}-${i}`);
      if (!bar) return;
      const s = pd(v.s), e = pd(v.e);
      const c = GAME_CONFIG[name];
      if (s && e && d >= s && d < e) {
        bar.style.background = c.a; bar.style.color = c.b;
        bar.style.fontWeight = '600'; bar.style.boxShadow = `0 0 0 1.5px ${c.a}`;
      } else {
        bar.style.background = c.b; bar.style.color = c.p;
        bar.style.fontWeight = '400'; bar.style.boxShadow = 'none';
      }
    });
  });
}

function buildScrubBarsHTML(name) {
  const c = GAME_CONFIG[name];
  const vs = GAMES[name] || [];
  const pageEnd = new Date(scPageStart);
  pageEnd.setDate(pageEnd.getDate() + PAGE_DAYS);
  return vs.map((v, i) => {
    const s = pd(v.s), e = pd(v.e);
    if (!s || !e || e <= scPageStart || s >= pageEnd) return '';
    const ld = Math.max(0, daysBetween(scPageStart, s));
    const rd = Math.min(PAGE_DAYS, daysBetween(scPageStart, e));
    const left = ld * PX_DAY, width = Math.max(4, (rd - ld) * PX_DAY);
    const isNow = TODAY >= s && TODAY < e;
    return `<div class="sc-bar" id="scb-${name}-${i}" data-game="${name}" data-idx="${i}"
      style="left:${left}px;width:${width}px;background:${isNow?c.a:c.b};color:${isNow?c.b:c.p};font-weight:${isNow?600:400};${isNow?`box-shadow:0 0 0 1.5px ${c.a};`:''}"
      >${v.v}</div>`;
  }).join('');
}

function buildRulerHTML() {
  let html = '';
  let prevMonth = -1, prevYear = -1;
  for (let i = 0; i < PAGE_DAYS; i++) {
    const d = new Date(scPageStart);
    d.setDate(d.getDate() + i);
    const x = i * PX_DAY;
    const day = d.getDate(), month = d.getMonth(), year = d.getFullYear();
    const isNewMonth = month !== prevMonth;
    const isMon = d.getDay() === 1;
    if (isNewMonth) {
      const yPart = year !== prevYear ? `${year}년 ` : '';
      html += `<div style="position:absolute;left:${x+3}px;top:4px;font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;pointer-events:none;">${yPart}${month+1}월</div>`;
      prevMonth = month; prevYear = year;
    }
    const tickH = isNewMonth ? 20 : isMon ? 12 : 6;
    const tickC = isNewMonth ? 'var(--text2)' : 'var(--border2)';
    html += `<div style="position:absolute;left:${x+PX_DAY/2}px;bottom:0;width:1px;height:${tickH}px;background:${tickC};pointer-events:none;"></div>`;
    if (isNewMonth || isMon || day % 5 === 0) {
      const lc = isNewMonth ? 'var(--text)' : 'var(--text3)';
      const fw = isNewMonth ? '600' : '400';
      html += `<div style="position:absolute;left:${x}px;bottom:${tickH+2}px;width:${PX_DAY}px;text-align:center;font-size:9px;color:${lc};font-weight:${fw};pointer-events:none;">${day}</div>`;
    }
  }
  return `<div class="sc-ruler" style="width:${PAGE_DAYS*PX_DAY}px;">${html}</div>`;
}

function buildScrubTrackHTML() {
  const trackW = PAGE_DAYS * PX_DAY;
  const rows = GAME_ORDER.filter(n => GAMES[n]).map(name =>
    `<div class="sc-bar-row" style="width:${trackW}px;">${buildScrubBarsHTML(name)}</div>`
  ).join('');
  return rows + buildRulerHTML();
}


function scInitPos() {
  const vp = document.getElementById('sc-vp');
  if (!vp) return;
  const W = vp.getBoundingClientRect().width;
  const off = daysBetween(scPageStart, TODAY);
  const clamped = Math.max(0, Math.min(PAGE_DAYS - 1, off));
  scTX = W / 2 - clamped * PX_DAY;
  scApply();
  scUpdateDate();
}

function initScrubDrag() {
  const vp = document.getElementById('sc-vp');
  if (!vp) return;
  if (scDragHandlers) {
    window.removeEventListener('mousemove', scDragHandlers.move);
    window.removeEventListener('mouseup', scDragHandlers.end);
  }
  let dragging = false, startX = 0, startTX = 0;
  const onStart = x => { dragging = true; startX = x; startTX = scTX; vp.classList.add('grabbing'); };
  const onMove = x => {
    if (!dragging) return;
    const vpEl = document.getElementById('sc-vp');
    const W = vpEl ? vpEl.getBoundingClientRect().width : 800;
    let proposed = startTX + (x - startX);
    let needsRebuild = false;
    while (proposed > W / 2) {
      scPageStart = new Date(scPageStart);
      scPageStart.setDate(scPageStart.getDate() - PAGE_DAYS);
      proposed -= PAGE_DAYS * PX_DAY;
      startTX -= PAGE_DAYS * PX_DAY;
      needsRebuild = true;
    }
    while (proposed < W / 2 - PAGE_DAYS * PX_DAY) {
      scPageStart = new Date(scPageStart);
      scPageStart.setDate(scPageStart.getDate() + PAGE_DAYS);
      proposed += PAGE_DAYS * PX_DAY;
      startTX += PAGE_DAYS * PX_DAY;
      needsRebuild = true;
    }
    if (needsRebuild) {
      const track = document.getElementById('sc-track');
      if (track) track.innerHTML = buildScrubTrackHTML();
    }
    scTX = proposed;
    scApply(); scUpdateDate();
  };
  const onEnd = () => { dragging = false; vp.classList.remove('grabbing'); };
  scDragHandlers = { move: e => { if (dragging) onMove(e.clientX); }, end: onEnd };
  vp.addEventListener('mousedown', e => onStart(e.clientX));
  window.addEventListener('mousemove', scDragHandlers.move);
  window.addEventListener('mouseup', scDragHandlers.end);
  vp.addEventListener('touchstart', e => onStart(e.touches[0].clientX), { passive: true });
  vp.addEventListener('touchmove', e => { e.preventDefault(); onMove(e.touches[0].clientX); }, { passive: false });
  vp.addEventListener('touchend', onEnd);
}

function initScrubTooltip() {
  const vp = document.getElementById('sc-vp');
  if (!vp) return;
  let tip = document.getElementById('sc-tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'sc-tip';
    tip.style.cssText = 'display:none;position:fixed;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius-lg);padding:12px;z-index:9999;width:200px;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,0.13);';
    document.body.appendChild(tip);
  }
  let hideTimer;
  vp.addEventListener('mousemove', e => {
    const bar = e.target.closest('[data-game]');
    if (!bar) {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => { tip.style.display = 'none'; }, 80);
      return;
    }
    clearTimeout(hideTimer);
    const name = bar.dataset.game, idx = parseInt(bar.dataset.idx);
    const v = (GAMES[name] || [])[idx];
    if (!v) return;
    const c = GAME_CONFIG[name];
    const fnA = sp(v.fn), frA = sp(v.fr), hnA = sp(v.hn), hrA = sp(v.hr);
    const tagN = arr => arr.map(n => `<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:${c.b};color:${c.p};font-weight:500;">${n}</span>`).join('');
    const tagR = arr => arr.map(n => `<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg3);color:var(--text2);">${n}</span>`).join('');
    const half = (na, ra) => (na.length || ra.length) ? tagN(na) + tagR(ra) : `<span style="font-size:10px;color:var(--text3);">정보 없음</span>`;
    tip.innerHTML = `
      <div style="font-size:10px;color:${c.a};font-weight:700;margin-bottom:3px;">${name} ${v.v}버전</div>
      <div style="font-size:10px;color:var(--text3);margin-bottom:8px;">${v.s} ~ ${v.e}</div>
      <div style="font-size:10px;font-weight:600;color:var(--text2);margin-bottom:3px;">전반</div>
      <div style="display:flex;flex-wrap:wrap;gap:3px;margin-bottom:7px;">${half(fnA, frA)}</div>
      <div style="font-size:10px;font-weight:600;color:var(--text2);margin-bottom:3px;">후반</div>
      <div style="display:flex;flex-wrap:wrap;gap:3px;">${half(hnA, hrA)}</div>
      ${v.memo ? `<div style="margin-top:6px;padding-top:6px;border-top:0.5px solid var(--border);font-size:10px;color:var(--text2);">${v.memo}</div>` : ''}`;
    const tipW = 200, tipH = tip.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight;
    let lx = e.clientX + 14;
    let ty = e.clientY - 10;
    if (lx + tipW > vw - 8) lx = e.clientX - tipW - 14;
    if (ty + tipH > vh - 8) ty = e.clientY - tipH - 10;
    if (ty < 4) ty = 4;
    tip.style.left = lx + 'px';
    tip.style.top = ty + 'px';
    tip.style.display = 'block';
  });
  vp.addEventListener('mouseleave', () => { clearTimeout(hideTimer); tip.style.display = 'none'; });
}

function initScrubAfterRender() {
  requestAnimationFrame(() => { scInitPos(); initScrubDrag(); initScrubTooltip(); });
}

window.scPrev = function() {
  scPageStart = new Date(scPageStart);
  scPageStart.setDate(scPageStart.getDate() - PAGE_DAYS);
  const track = document.getElementById('sc-track');
  if (track) track.innerHTML = buildScrubTrackHTML();
  const vp = document.getElementById('sc-vp');
  const W = vp ? vp.getBoundingClientRect().width : 800;
  scTX = W / 2 - Math.floor(PAGE_DAYS / 2) * PX_DAY;
  scApply(); scUpdateDate();
};

window.scNext = function() {
  scPageStart = new Date(scPageStart);
  scPageStart.setDate(scPageStart.getDate() + PAGE_DAYS);
  const track = document.getElementById('sc-track');
  if (track) track.innerHTML = buildScrubTrackHTML();
  const vp = document.getElementById('sc-vp');
  const W = vp ? vp.getBoundingClientRect().width : 800;
  scTX = W / 2 - Math.floor(PAGE_DAYS / 2) * PX_DAY;
  scApply(); scUpdateDate();
};

window.scReset = function() {
  scPageStart = new Date(TODAY);
  scPageStart.setDate(scPageStart.getDate() - 42);
  const track = document.getElementById('sc-track');
  if (track) track.innerHTML = buildScrubTrackHTML();
  scInitPos();
};

// ── 데이터 fetch ──────────────────────────────────────
async function fetchData() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    const rows = parseCSV(text);
    GAMES = buildGameData(rows);
    render();
  } catch (e) {
    document.getElementById('main').innerHTML = `
      <div class="error-box">
        <p style="font-size:15px;font-weight:600;margin-bottom:8px;">데이터를 불러오지 못했어요</p>
        <p style="font-size:13px;">구글 시트 공개 설정을 확인하거나 잠시 후 다시 시도해주세요.</p>
        <p style="font-size:12px;color:var(--text3);margin-top:8px;">${e.message}</p>
      </div>`;
  }
}

fetchData();
</script>
